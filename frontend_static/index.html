<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNETP - Plateforme Collaborative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            100: '#06060c',
                            200: '#020204',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slideIn { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-[#020204] text-slate-300 h-screen w-screen overflow-hidden flex transition-colors duration-200">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-72 border-r border-white/10 flex flex-col bg-[#020204] z-20 shrink-0">
        <!-- Contenu injecté par JS -->
        <div class="p-6">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <i data-lucide="shield" class="text-blue-500"></i>
                CNETP
            </h1>
        </div>
        <nav id="sidebar-nav" class="flex-1 overflow-y-auto px-4 space-y-1">
            <!-- Menu items -->
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full min-w-0 relative bg-[#06060c]/20">
        <div class="absolute top-0 inset-x-0 h-40 bg-gradient-to-b from-blue-500/5 to-transparent pointer-events-none"></div>

        <!-- TOP NAV -->
        <nav class="h-14 px-6 flex items-center justify-between shrink-0 z-10 border-b border-white/10 bg-black/40 backdrop-blur-md overflow-x-auto whitespace-nowrap scrollbar-none">
            <div id="nav-tabs" class="flex items-center gap-1">
                <!-- Tabs injectés par JS -->
            </div>
            
            <div class="flex items-center gap-3">
                <button id="theme-toggle" class="px-3 py-1.5 rounded-lg border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 text-xs font-bold">
                    ☀️ Thème Clair
                </button>
                <button id="profile-btn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-blue-500/30 bg-blue-500/5 text-blue-400 text-xs font-bold">
                    <i data-lucide="users" class="h-3.5 w-3.5"></i>
                    <span id="user-name">Chargement...</span>
                </button>
            </div>
        </nav>

        <!-- VIEWPORT -->
        <div id="viewport" class="flex-1 min-h-0 flex flex-col z-10">
            <!-- Contenu dynamique -->
            <div class="flex-1 flex items-center justify-center">
                <i data-lucide="loader" class="h-8 w-8 text-blue-500 animate-spin"></i>
            </div>
        </div>
    </main>

    <!-- MESSAGING WIDGET -->
    <div id="messaging-widget"></div>

    <!-- SCRIPTS -->
    <script src="js/api.js"></script>
    <script src="js/components/messaging.js"></script>
    <script src="js/components/history.js"></script>
    <script src="js/components/experts.js"></script>
    <script src="js/components/meetings.js"></script>
    <script src="js/components/financial.js"></script>
    <script src="js/components/validation.js"></script>
    <script src="js/components/legistique.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
