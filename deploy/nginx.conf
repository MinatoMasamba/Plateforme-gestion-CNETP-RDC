# Exemple de configuration Nginx pour un reverse proxy HTTPS vers Django.
# Assure que Django voit X-Forwarded-Proto=https.

upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name workalldomain.pythonanywhere.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name workalldomain.pythonanywhere.com;

    ssl_certificate /etc/letsencrypt/live/workalldomain.pythonanywhere.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workalldomain.pythonanywhere.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/cnetp_access.log;
    error_log /var/log/nginx/cnetp_error.log;

    location /static/ {
        alias /home/minato/project/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/minato/project/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }
}
