target-version = "py312"
line-length = 120
exclude = [
    "mon_env",
    "build_tailwind",
    "htmlcov",
    "*_old.py",
    "**/migrations/*",
]

[lint]
# Jeu de règles volontairement ciblé : erreurs réelles (syntaxe, noms
# indéfinis, comparaisons invalides) pour garder la CI actionnable.
select = ["E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
"tests/*" = ["F"]
"**/tests.py" = ["F"]
