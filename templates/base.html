{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}CNETP - Plateforme de Gestion des Normes{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <!-- Global CSRF Token -->
    <script>
        window.DJANGO_CSRF_TOKEN = "{{ csrf_token }}";
        window.API_BASE_URL = "{{ api_base_url|default:'/api/v1/' }}";
        window.CURRENT_USER = {{ current_user_json|safe|default:'null' }};
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
