<!-- ═══════════════════════════════════════════════════════════════════
     SIDEBAR — ADMINISTRATEURS TECHNIQUES ET FINANCIERS (Postes 18 à 20)
═══════════════════════════════════════════════════════════════════ -->
<div id="atf-sidebar-overlay" onclick="setATFSidebarOpen(false)"
     class="hidden fixed inset-0 bg-slate-900/50 z-30 lg:hidden backdrop-blur-sm"></div>

<aside id="atf-sidebar"
       class="hidden lg:flex lg:flex-col w-72 shrink-0 border-r border-slate-200 dark:border-white/[8%]
              bg-white/80 dark:bg-black/40 backdrop-blur-xl overflow-y-auto scrollbar-none
              fixed lg:static inset-y-0 left-0 z-40">

    <div class="p-5 border-b border-slate-200 dark:border-white/[8%]">
        <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Comité de Pilotage Élargi</p>
        <p class="text-sm font-extrabold text-slate-800 dark:text-white mt-1">Administrateurs Techniques et Financiers</p>
        <p class="text-[10px] text-slate-400 mt-0.5">Postes 18 à 20 — Office des Routes, Office des Voiries et Drainage, Agence Congolaise des Grands Travaux</p>
    </div>

    <nav class="flex-1 py-4 px-3 space-y-1.5">
        {% for poste in postes %}
        <button data-view="post-{{ poste.n }}" onclick="switchView('post-{{ poste.n }}')"
                class="sidebar-nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left
                       border border-transparent transition-all
                       hover:bg-slate-100 dark:hover:bg-white/5 text-slate-600 dark:text-slate-300">
            <div class="w-9 h-9 rounded-xl bg-{{ poste.accent }}-400/15 flex items-center justify-center shrink-0">
                <i data-lucide="{{ poste.icon }}" class="w-4 h-4 text-{{ poste.accent }}-400"></i>
            </div>
            <div class="min-w-0 flex-1">
                <p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Poste {{ poste.n }}</p>
                <p class="text-xs font-bold truncate">{{ poste.title }}</p>
            </div>
            {% if poste.is_mine %}
            <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded-full bg-blue-400/15 text-blue-400 uppercase tracking-wide shrink-0">
                Moi
            </span>
            {% endif %}
        </button>
        {% endfor %}
    </nav>

    <div class="p-4 border-t border-slate-200 dark:border-white/[8%]">
        <a href="{% url 'web:pilotage_dashboard' %}"
           class="flex items-center gap-2 text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-white transition-colors">
            <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
            Retour au tableau de bord Pilotage
        </a>
    </div>
</aside>
