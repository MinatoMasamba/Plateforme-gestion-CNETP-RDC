<!-- ═══════════════════════════════════════════════════════════════════
     GROUPE D'ACTIONS DE CADRAGE (une Phase) — Bureau Directoire

     Contexte attendu : `group` ({'phase','stage','action','label','items'}),
     `is_mine` (bool).
═══════════════════════════════════════════════════════════════════ -->
<div class="space-y-3">
    {% if group.items %}
        {% for item in group.items %}
            {% include "pilotage/app/components/_cadrage_action_item.html" with item=item is_mine=is_mine %}
        {% endfor %}
    {% else %}
    <div class="rounded-2xl border border-dashed border-indigo-400/20 p-8 text-center">
        <i data-lucide="compass" class="w-8 h-8 text-indigo-400/40 mx-auto mb-2"></i>
        <p class="text-xs font-semibold text-slate-500">Aucun dossier en attente sur cette étape actuellement</p>
    </div>
    {% endif %}
</div>
