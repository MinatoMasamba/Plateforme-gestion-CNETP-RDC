{% load static %}
<!-- ═══════════════════════════════════════════════════════════════════
     TOPBAR — ESPACE ADMINISTRATIF BUREAU DIRECTOIRE
═══════════════════════════════════════════════════════════════════ -->
<header class="sticky top-0 z-30 bg-white/90 dark:bg-black/80 backdrop-blur border-b
               border-slate-200 dark:border-white/[8%] shrink-0">

    <div class="flex h-1">
        <div class="flex-1 bg-[#0095c9]"></div>
        <div class="flex-1 bg-[#fff24b]"></div>
        <div class="flex-1 bg-[#db3832]"></div>
    </div>

    <div class="flex items-center justify-between px-4 sm:px-5 py-2.5 sm:py-3">

    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="hidden sm:flex items-center gap-2.5 shrink-0 select-none">
            <div class="w-9 h-9 rounded-full overflow-hidden shrink-0 border border-[#d4af37] bg-white drop-shadow-[0_1.5px_3px_rgba(0,0,0,0.15)]">
                <img src="{% static 'img/logo-cnetp.png' %}" alt="République Démocratique du Congo"
                     width="36" height="36" class="w-full h-full object-cover">
            </div>
            <div class="w-[3px] h-[26px] flex flex-col rounded-sm overflow-hidden shrink-0">
                <div class="flex-1 bg-[#0095c9]"></div>
                <div class="h-[25%] bg-[#fff24b]"></div>
                <div class="flex-1 bg-[#db3832]"></div>
            </div>
        </div>
        <button id="pilotage-mobile-menu-btn" onclick="toggleDirectoireSidebar()" aria-label="Ouvrir le menu"
                class="lg:hidden p-1.5 -ml-1 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5 text-slate-500 dark:text-slate-400 transition-colors">
            <i data-lucide="menu" class="w-4.5 h-4.5 sm:w-5 sm:h-5"></i>
        </button>

        <a href="{% url 'web:pilotage_dashboard' %}"
           class="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-white transition-colors shrink-0">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Pilotage</span>
        </a>
        <span class="hidden sm:inline text-slate-300 dark:text-white/15">|</span>
        <h1 class="text-[12px] sm:text-sm lg:text-base font-extrabold tracking-tight text-slate-700 dark:text-white uppercase truncate">
            Bureau Directoire
        </h1>
    </div>

    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        {% if my_poste %}
        <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/[3%]">
            <div class="w-6 h-6 rounded-full bg-[#0095c9] text-white flex items-center justify-center text-[10px] font-bold uppercase shrink-0">
                {{ expert.user.first_name|first|upper }}{{ expert.user.last_name|first|upper }}
            </div>
            <div class="leading-tight min-w-0">
                <p class="text-[11px] font-bold text-slate-700 dark:text-slate-200 truncate">{{ expert.user.get_full_name }}</p>
                <p class="text-[9px] uppercase font-mono text-slate-400 truncate hidden sm:block">{{ my_poste.title }}</p>
            </div>
        </div>
        {% endif %}

        <!-- Assistant IA Pilotage -->
        <a href="{% url 'web:pilotage_ia_console' %}" title="Assistant IA Pilotage"
           class="p-2 rounded-lg border border-slate-200 dark:border-white/10
                  hover:bg-slate-100 dark:hover:bg-white/5 transition-colors text-[#0095c9] dark:text-[#0095c9]">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
        </a>

        <!-- Bouton thème -->
        <button onclick="toggleTheme()" title="Changer le thème"
                class="p-2 rounded-lg border border-slate-200 dark:border-white/10
                       hover:bg-slate-100 dark:hover:bg-white/5 transition-colors text-slate-500 dark:text-slate-400">
            <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
            <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
        </button>
    </div>
    </div>
</header>
