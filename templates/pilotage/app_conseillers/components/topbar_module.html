<!-- ═══════════════════════════════════════════════════════════════════
     TOPBAR — ESPACE ADMINISTRATIF CONSEILLERS INSTITUTIONNELS ET POLITIQUES
═══════════════════════════════════════════════════════════════════ -->
<header class="sticky top-0 z-30 flex items-center justify-between px-5 py-3
               bg-white/90 dark:bg-black/80 backdrop-blur border-b
               border-slate-200 dark:border-white/8 shrink-0">

    <div class="flex items-center gap-3 min-w-0">
        <button onclick="toggleConseillersSidebar()"
                class="lg:hidden p-1.5 -ml-1 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5 text-slate-500 dark:text-slate-400 transition-colors">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <a href="{% url 'web:pilotage_dashboard' %}"
           class="hidden sm:flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-white transition-colors shrink-0">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Pilotage
        </a>
        <span class="hidden sm:inline text-slate-300 dark:text-white/15">|</span>
        <h1 class="text-sm font-extrabold tracking-tight text-slate-700 dark:text-white uppercase truncate">
            Conseillers Institutionnels et Politiques
        </h1>
        <span class="hidden sm:inline-block text-[9px] font-bold px-2 py-0.5 rounded-full border
                     bg-blue-50 text-blue-700 border-blue-300
                     dark:bg-blue-400/10 dark:text-blue-400 dark:border-blue-400/25
                     uppercase tracking-widest shrink-0">
            Postes 6—17
        </span>
    </div>

    <div class="flex items-center gap-3 shrink-0">
        {% if poste %}
        <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/3">
            <div class="w-6 h-6 rounded-full bg-blue-500 text-white flex items-center justify-center text-[10px] font-bold uppercase shrink-0">
                {{ expert.user.first_name|first|upper }}{{ expert.user.last_name|first|upper }}
            </div>
            <div class="leading-tight min-w-0">
                <p class="text-[11px] font-bold text-slate-700 dark:text-slate-200 truncate">{{ expert.user.get_full_name }}</p>
                <p class="text-[9px] uppercase font-mono text-slate-400 truncate">{{ poste.title }}</p>
            </div>
        </div>
        {% endif %}

        <!-- Bouton thème -->
        <button onclick="toggleTheme()" title="Changer le thème"
                class="p-2 rounded-lg border border-slate-200 dark:border-white/10
                       hover:bg-slate-100 dark:hover:bg-white/5 transition-colors text-slate-500 dark:text-slate-400">
            <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
            <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
        </button>
    </div>
</header>
