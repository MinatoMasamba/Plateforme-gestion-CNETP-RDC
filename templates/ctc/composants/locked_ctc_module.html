<!-- ═══════════════════════════════════════════════════════════════════
     MODULE VERROUILLÉ CTC — Cloisonnement intra-cellulaire
     Permission → routed to Assistant Exécutif
═══════════════════════════════════════════════════════════════════ -->
<div class="rounded-2xl border border-slate-200 dark:border-white/8 bg-slate-50 dark:bg-white/2 p-6
            flex flex-col items-center justify-center text-center gap-3 min-h-[140px] relative overflow-hidden
            group hover:border-teal-400/30 transition-colors">

    <!-- Watermark décoratif -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none select-none">
        <i data-lucide="lock" class="w-24 h-24 text-slate-200 dark:text-white/3"></i>
    </div>

    <div class="relative z-10 flex flex-col items-center gap-2">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center
                    bg-slate-200 dark:bg-white/8 border border-slate-300 dark:border-white/10">
            <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
        </div>

        <div>
            <p class="text-xs font-extrabold text-slate-600 dark:text-slate-400">
                {{ locked_module_name|default:"Module verrouillé" }}
            </p>
            <p class="text-[10px] text-slate-400 dark:text-slate-500 mt-0.5">
                Pôle : {{ locked_module_pole|default:"Hors pôle" }}
            </p>
        </div>

        <p class="text-[10px] text-slate-500 max-w-[200px] leading-relaxed">
            Ce module est réservé au pôle concerné.
            Demandez une ouverture temporaire à l'<strong class="text-teal-400">Assistant Exécutif</strong>.
        </p>

        <button onclick="openCTCPermissionModal('{{ locked_module_name|default:'module' }}')"
                class="mt-1 flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[10px] font-extrabold
                       bg-teal-500/10 text-teal-500 border border-teal-500/20
                       hover:bg-teal-500/20 transition-colors">
            <i data-lucide="key" class="w-3 h-3"></i>
            Demander accès temporaire
        </button>
    </div>
</div>
