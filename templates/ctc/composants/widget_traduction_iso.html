<div class="space-y-4">
    <div class="rounded-xl border border-blue-400/20 bg-white dark:bg-white/[2%] p-4">
        <div class="flex items-center justify-between gap-3 mb-3">
            <div>
                <h3 class="text-xs font-extrabold uppercase tracking-widest text-blue-400">Examens ISO / SADC assignés</h3>
                <p class="text-[10px] text-slate-500 mt-1">Chaque décision est enregistrée dans le dossier CTC.</p>
            </div>
            <i data-lucide="file-check-2" class="w-5 h-5 text-blue-400"></i>
        </div>
        {% for review in my_pending_reviews %}
        <form class="ctc-review-form border-t border-slate-100 dark:border-white/5 py-3 space-y-2" data-review-id="{{ review.pk }}" data-review-type="iso">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                    <p class="text-[9px] font-bold uppercase tracking-wider text-blue-400 font-mono">{{ review.norme.reference_number }}</p>
                    <p class="text-xs font-bold text-slate-700 dark:text-slate-200">{{ review.norme.title }}</p>
                </div>
                <span class="text-[9px] text-amber-500">{{ review.get_status_display }}</span>
            </div>
            <textarea name="feedback" rows="2" placeholder="Observations ISO / SADC…" class="w-full text-xs rounded-lg border px-3 py-2 resize-none border-slate-200 dark:border-white/10 bg-transparent"></textarea>
            <div class="flex gap-2">
                <button type="submit" name="status" value="APPROVED" class="flex-1 py-2 rounded-lg text-[10px] font-bold bg-emerald-500 hover:bg-emerald-400 text-white"><i data-lucide="check" class="w-3 h-3 inline"></i> Accepter</button>
                <button type="submit" name="status" value="REJECTED" class="flex-1 py-2 rounded-lg text-[10px] font-bold border border-red-400/30 text-red-500 hover:bg-red-400/10"><i data-lucide="x" class="w-3 h-3 inline"></i> Refuser</button>
            </div>
            <p class="ctc-review-msg hidden text-[10px] text-center"></p>
        </form>
        {% empty %}
        <div class="border-t border-slate-100 dark:border-white/5 pt-5 text-center text-xs text-slate-500">Aucun examen ISO assigné à votre poste.</div>
        {% endfor %}
    </div>
</div>

<script>
document.querySelectorAll('.ctc-review-form').forEach(function(form) {
    form.addEventListener('submit', function(event) {
        event.preventDefault();
        const msg = form.querySelector('.ctc-review-msg');
        const button = event.submitter;
        window.withButtonLoading(button, function() {
            return window.fetchWithTimeout(`/ctc/revue/${form.dataset.reviewType}/${form.dataset.reviewId}/`, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': getCookie('csrftoken')},
                body: new URLSearchParams({status: button.value, feedback: form.querySelector('[name="feedback"]').value})
            }).then(function(response) { return response.json().then(function(data) { if (!response.ok || !data.ok) throw new Error(data.error || 'Action refusée.'); return data; }); });
        }).then(function(data) {
            msg.className = 'ctc-review-msg text-[10px] text-center text-emerald-500';
            msg.textContent = data.message;
            setTimeout(function() { window.location.reload(); }, 500);
        }).catch(function(error) {
            msg.className = 'ctc-review-msg text-[10px] text-center text-red-500';
            msg.textContent = error.message;
        });
    });
});
</script>
