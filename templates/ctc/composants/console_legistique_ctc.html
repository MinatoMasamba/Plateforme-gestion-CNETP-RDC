<div class="space-y-4">
    <div class="rounded-xl border border-blue-400/20 bg-white dark:bg-white/[2%] p-4">
        <div class="flex items-center justify-between gap-3 mb-3">
            <div>
                <h3 class="text-xs font-extrabold uppercase tracking-widest text-blue-400">Dossiers légistiques assignés</h3>
                <p class="text-[10px] text-slate-500 mt-1">La validation légistique ne clôture pas les autres examens CTC.</p>
            </div>
            <i data-lucide="scale" class="w-5 h-5 text-blue-400"></i>
        </div>
        {% for review in my_pending_reviews %}
        <form class="ctc-legistic-form border-t border-slate-100 dark:border-white/5 py-3 space-y-2" data-review-id="{{ review.pk }}">
            <p class="text-[9px] font-bold uppercase tracking-wider text-blue-400 font-mono">{{ review.norme.reference_number }}</p>
            <p class="text-xs font-bold text-slate-700 dark:text-slate-200">{{ review.norme.title }}</p>
            <textarea name="comments" rows="3" placeholder="Observations légistiques…" class="w-full text-xs rounded-lg border px-3 py-2 resize-none border-slate-200 dark:border-white/10 bg-transparent">{{ review.comments }}</textarea>
            <button type="submit" class="w-full py-2 rounded-lg text-[10px] font-bold bg-blue-500 hover:bg-blue-400 text-white"><i data-lucide="check" class="w-3 h-3 inline"></i> Enregistrer la validation</button>
            <p class="ctc-legistic-msg hidden text-[10px] text-center"></p>
        </form>
        {% empty %}
        <div class="border-t border-slate-100 dark:border-white/5 pt-5 text-center text-xs text-slate-500">Aucun dossier légistique assigné à votre poste.</div>
        {% endfor %}
    </div>
</div>

<script>
document.querySelectorAll('.ctc-legistic-form').forEach(function(form) {
    form.addEventListener('submit', function(event) {
        event.preventDefault();
        const msg = form.querySelector('.ctc-legistic-msg');
        const button = form.querySelector('button[type="submit"]');
        window.withButtonLoading(button, function() {
            return window.fetchWithTimeout(`/api/v1/legistic-reviews/${form.dataset.reviewId}/validate-ctc/`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                body: JSON.stringify({comments: form.querySelector('[name="comments"]').value})
            }).then(function(response) { return response.json().then(function(data) { if (!response.ok) throw new Error(data.detail || data.error || 'Validation refusée.'); return data; }); });
        }).then(function() {
            msg.className = 'ctc-legistic-msg text-[10px] text-center text-emerald-500';
            msg.textContent = 'Validation enregistrée. Les autres examens restent à traiter.';
            setTimeout(function() { window.location.reload(); }, 500);
        }).catch(function(error) {
            msg.className = 'ctc-legistic-msg text-[10px] text-center text-red-500';
            msg.textContent = error.message;
        });
    });
});
</script>
