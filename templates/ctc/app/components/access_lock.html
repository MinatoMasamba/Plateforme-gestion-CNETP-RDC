<div class="h-full min-h-[220px] flex flex-col items-center justify-center p-4 text-center bg-slate-50 rounded-xl border border-dashed border-slate-300 dark:bg-black/20 dark:border-white/5">
    <div class="w-10 h-10 bg-slate-200 rounded-xl flex items-center justify-center text-slate-500 mb-3 shadow-inner dark:bg-white/5 dark:text-slate-400">
        <i data-lucide="lock" class="w-5 h-5"></i>
    </div>
    <h4 class="text-xs font-bold text-slate-800 dark:text-slate-200 mb-1">Accès Restreint</h4>
    <p class="text-[11px] text-slate-500 dark:text-slate-400 max-w-xs mb-4 leading-normal">
        Exclusif au pôle <span class="font-bold uppercase text-slate-700 dark:text-slate-300">{{ owner_pole }}</span>.<br>
        Votre profil ({{ pole_label }}) ne dispose pas des privilèges requis.
    </p>
    <button type="button" onclick="openCTCPermissionModal('{{ module_title|escapejs }}')"
            class="w-full max-w-xs flex items-center justify-center gap-1.5 bg-slate-900 text-white font-bold py-1.5 rounded-lg text-[11px] hover:bg-slate-800 transition-colors cursor-pointer dark:bg-white/10 dark:hover:bg-white/20">
        <span>Envoyer la requête</span> <i data-lucide="send" class="w-3 h-3"></i>
    </button>
</div>
