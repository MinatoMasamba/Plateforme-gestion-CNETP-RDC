<section class="st-notifications" data-st-notifications>
    <header class="st-notifications-header">
        <div><p class="st-notifications-eyebrow">Centre de notifications</p><h2>Vos notifications</h2><p data-st-notifications-summary>Chargement…</p></div>
        <button type="button" class="st-notifications-button" data-st-notifications-refresh><i data-lucide="refresh-cw"></i> Actualiser</button>
    </header>
    <p role="status" data-st-notifications-error hidden></p>
    <nav class="st-notifications-filters" data-st-notifications-filters aria-label="Catégories de notifications"></nav>
    <div class="st-notifications-layout">
        <div class="st-notifications-list" data-st-notifications-list></div>
        <section class="st-notifications-detail" data-st-notifications-detail aria-label="Détail de la notification" tabindex="-1"><p>Ouvrez une notification pour consulter le détail du cas.</p></section>
    </div>
</section>
