<section class="institutional-page mx-auto max-w-5xl space-y-5 p-4 sm:p-6" aria-labelledby="archives-title"><div><p class="text-sm institutional-muted">Système</p><h2 id="archives-title" class="text-2xl font-bold">Archives</h2></div><div class="grid gap-3 sm:grid-cols-2"><label class="block text-sm font-semibold">Rechercher une norme archivée<input type="search" data-archive-search class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-600 dark:bg-slate-900" placeholder="Référence ou titre"></label><label class="block text-sm font-semibold">Archivée depuis le<input type="date" data-archive-date class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-600 dark:bg-slate-900"></label></div><div class="institutional-card overflow-hidden"><table class="institutional-table institutional-table--stacked"><thead><tr><th>Référence</th><th>Norme</th><th>Statut</th><th>Dernière mise à jour</th></tr></thead><tbody>{% for norme in archived_norms %}<tr data-archive-row data-archive-updated="{{ norme.updated_at|date:'Y-m-d' }}"><td data-label="Référence">{{ norme.reference_number }}</td><td data-label="Norme">{{ norme.title }}</td><td data-label="Statut">{{ norme.get_status_display }}</td><td data-label="Dernière mise à jour">{{ norme.updated_at|date:'d/m/Y' }}</td></tr>{% empty %}<tr><td colspan="4" class="institutional-muted">Aucun dossier réellement archivé.</td></tr>{% endfor %}</tbody></table></div></section><script>(() => { const search = document.querySelector('[data-archive-search]'); const date = document.querySelector('[data-archive-date]'); function filter() { document.querySelectorAll('[data-archive-row]').forEach(row => row.hidden = !row.textContent.toLocaleLowerCase().includes(search.value.toLocaleLowerCase()) || (date.value && row.dataset.archiveUpdated < date.value)); } search?.addEventListener('input', filter); date?.addEventListener('change', filter); })();</script>
