<button
    id="toggle-messaging-floating"
    onclick="openMessagingWidget()"
    class="font-bold px-4 py-3 rounded-full flex items-center gap-3.5 shadow-[0_10px_30px_rgba(0,0,0,0.5)] cursor-pointer group hover:scale-105 transition-all text-xs tracking-wider uppercase backdrop-blur-md bg-white border hover:border-blue-400 border-blue-300 text-blue-600 hover:text-blue-700 dark:bg-[#020204] dark:border-blue-500/30 dark:hover:border-blue-400 dark:text-blue-400 dark:hover:text-blue-300"
>
    <div class="relative">
        <i data-lucide="message-square" class="h-5 w-5 fill-blue-100 dark:fill-blue-500/10 group-hover:animate-pulse"></i>
        <span id="unread-badge" class="absolute -top-2.5 -right-2.5 h-4.5 w-4.5 rounded-full bg-red-500 text-white font-extrabold text-[9px] flex items-center justify-center animate-bounce shadow-md">
            3
        </span>
    </div>
    <span class="font-sans font-bold select-none">Messagerie CNETP</span>
    <span class="h-2 w-2 rounded-full animate-pulse inline-block bg-blue-500"></span>
</button>

<div 
    id="messaging-window"
    class="hidden border rounded-2xl shadow-[0_20px_50px_rgba(37,99,235,0.15)] dark:shadow-[0_20px_50px_rgba(0,0,0,0.8)] flex-col backdrop-blur-xl transition-all duration-300 w-[700px] h-[500px] max-w-[calc(100vw-2rem)] max-h-[calc(100vh-2rem)] bg-white/95 border-blue-200 text-blue-900 dark:bg-[#020204]/95 dark:border-white/10 dark:text-slate-300"
>
    <div class="h-14 border-b px-4.5 flex items-center justify-between shrink-0 rounded-t-2xl border-blue-200 bg-blue-50/80 dark:border-white/10 dark:bg-black/40">
        <div class="flex items-center gap-2.5">
            <div class="h-8 w-8 rounded-lg flex items-center justify-center border bg-blue-100 text-blue-600 border-blue-300 dark:bg-blue-500/15 dark:border-blue-500/30 dark:text-blue-400">
                <i data-lucide="message-square" class="h-4 w-4"></i>
            </div>
            <div>
                <h3 class="text-xs font-extrabold uppercase tracking-wider flex items-center gap-2 text-slate-800 dark:text-white">
                    Messagerie Sécurisée CNETP
                    <span id="encryption-badge" class="text-[9px] font-bold px-2 py-0.5 rounded-full font-mono bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-400">
                        SÉCURISÉ (AES-256)
                    </span>
                </h3>
                <p id="messaging-minimized-title" class="hidden text-[10px] text-slate-500 font-medium">Discuter avec ...</p>
            </div>
        </div>

        <div class="flex items-center gap-1.5">
            <button 
                onclick="minimizeMessagingWidget()" 
                class="p-1.5 rounded-md text-slate-500 hover:text-slate-800 dark:hover:text-white dark:hover:bg-white/5 transition-all cursor-pointer"
                title="Réduire"
            >
                <i id="minimize-icon" data-lucide="chevron-down" class="h-4 w-4 transition-transform"></i>
            </button>
            <button 
                onclick="closeMessagingWidget()" 
                class="p-1.5 rounded-md text-slate-500 hover:text-slate-800 dark:hover:text-white dark:hover:bg-white/5 transition-all cursor-pointer"
                title="Fermer"
            >
                <i data-lucide="x" class="h-4 w-4"></i>
            </button>
        </div>
    </div>

    <div id="messaging-content" class="flex-1 min-h-0 flex bg-transparent">
        
        <div class="w-64 border-r border-slate-200 dark:border-white/10 flex flex-col h-full bg-slate-50/50 dark:bg-black/25 shrink-0">
            <div class="p-3 border-b border-slate-200 dark:border-white/10">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-2.5 top-2.5 h-3 w-3 text-slate-500"></i>
                    <input
                        type="text"
                        placeholder="Chercher un interlocuteur..."
                        oninput="filterContacts(this.value)"
                        class="w-full pl-8 pr-3 py-1.5 rounded-lg border focus:outline-hidden focus:ring-1 transition-all bg-white border-slate-300 text-slate-800 focus:border-blue-400 focus:ring-blue-100 dark:border-white/5 dark:bg-black/45 text-[11px] dark:text-white font-medium dark:focus:border-blue-500/30"
                    />
                </div>
            </div>

            <div id="contacts-list" class="flex-1 overflow-y-auto divide-y divide-slate-200 dark:divide-white/5 scrollbar-none">
                </div>
        </div>

        <div class="flex-1 flex flex-col h-full bg-white dark:bg-black/10">
            
            <div class="px-4.5 py-3 border-b border-blue-100 bg-white/50 dark:bg-black/15 dark:border-white/5 flex items-center justify-between shrink-0">
                <div class="min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <h4 id="active-contact-name" class="text-xs font-extrabold truncate text-slate-900 dark:text-white">Sélectionnez un contact</h4>
                        <span id="active-contact-status-dot" class="h-1.5 w-1.5 rounded-full bg-slate-400 dark:bg-slate-600"></span>
                        <span id="active-contact-status-text" class="text-[9px] font-mono font-bold uppercase text-slate-500">Hors ligne</span>
                    </div>
                    <p class="text-[10px] truncate mt-0.5 font-medium text-slate-600 dark:text-slate-400">
                        <span id="active-contact-role"></span> • <span id="active-contact-struct" class="font-semibold text-blue-700 dark:text-blue-400"></span>
                    </p>
                </div>
            </div>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-none bg-slate-50/50 dark:bg-[#020204]/30">
                <p class="text-[10.5px] text-slate-500 italic py-12 text-center">Début de l'historique sécurisé des messages.</p>
            </div>

            <form onsubmit="handleSendMessage(event)" class="p-3 border-t shrink-0 bg-slate-50 border-blue-200 dark:border-white/10 dark:bg-black/30">
                <div class="flex items-center gap-2">
                    <input
                        type="text"
                        id="chat-input-text"
                        placeholder="Écrire un message..."
                        oninput="document.getElementById('send-msg-btn').disabled = !this.value.trim()"
                        class="flex-1 text-xs px-3.5 py-2.5 rounded-lg border focus:outline-hidden focus:ring-2 font-medium transition-colors bg-white border-slate-300 text-slate-800 placeholder-slate-400 focus:border-blue-400 focus:ring-blue-100 dark:border-white/5 dark:bg-black/50 dark:text-white dark:placeholder-slate-600 dark:focus:border-blue-500/40 dark:focus:ring-blue-500/5"
                    />
                    <button
                        type="submit"
                        id="send-msg-btn"
                        disabled
                        class="h-9.5 w-9.5 rounded-lg flex items-center justify-center shrink-0 disabled:opacity-40 transition-all cursor-pointer shadow-md bg-blue-600 hover:bg-blue-700 text-white dark:bg-blue-500 dark:hover:bg-blue-400 dark:text-black"
                    >
                        <i data-lucide="send" class="h-3.5 w-3.5"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // ETAT ET DONNÉES SIMULÉES DE LA MESSAGERIE
    // =========================================================================
    const chatState = {
        isOpen: false,
        isMinimized: false,
        activeContactId: null,
        myProfile: { id: 'me', name: "Prof. Masamba Édouard" },
        
        contacts: [
            { id: "col-2", name: "Marie Laurent", email: "marie@cnetp.cd", role: "Coordinatrice", avatarColor: "#ec4899", isOnline: true, structure: "Secrétariat Technique" },
            { id: "exp-2", name: "Ir. Chantal Mwamba", email: "chantal@cnetp.cd", role: "Secrétaire", avatarColor: "#14b8a6", isOnline: true, structure: "OVD" },
            { id: "exp-4", name: "Ir. Godefroid Munongo", email: "g.munongo@sogert.cd", role: "Membre", avatarColor: "#eab308", isOnline: false, structure: "Office des Routes" }
        ],
        
        // Stockage simulé des messages (Mappé par Contact ID)
        messages: {
            "col-2": [
                { id: "msg-1", senderId: "col-2", senderName: "Marie", text: "Bonjour Édouard, j'ai relu le brouillon 4.1.", timestamp: "10:24" },
                { id: "msg-2", senderId: "me", senderName: "Moi", text: "Bonjour Marie, oui c'est adapté aux réalités.", timestamp: "10:28" }
            ],
            "exp-2": [
                { id: "msg-3", senderId: "exp-2", senderName: "Chantal", text: "Nous devons fixer la date de la prochaine réunion.", timestamp: "Hier, 16:15" },
                { id: "share-1", senderId: "exp-2", senderName: "Chantal", text: "📢 J'ai partagé cette clause pour examen :", timestamp: "Hier, 16:20", isClauseShare: true, clauseCode: "Pr-RDC 9001", clauseExcerpt: "Le drainage des eaux pluviales est obligatoire pour tout ouvrage R+1." }
            ],
            "exp-4": []
        }
    };

    // =========================================================================
    // LOGIQUE UI : OUVRIR, FERMER, RÉDUIRE
    // =========================================================================
    function openMessagingWidget() {
        chatState.isOpen = true;
        chatState.isMinimized = false;
        
        document.getElementById('toggle-messaging-floating').classList.add('hidden');
        const windowEl = document.getElementById('messaging-window');
        windowEl.classList.remove('hidden');
        windowEl.classList.add('flex');
        
        // Setup state visuel complet (Fenêtre agrandie)
        windowEl.classList.replace("w-80", "w-[700px]");
        windowEl.classList.replace("h-14", "h-[500px]");
        document.getElementById('messaging-content').classList.remove('hidden');
        document.getElementById('encryption-badge').classList.remove('hidden');
        document.getElementById('messaging-minimized-title').classList.add('hidden');
        document.getElementById('minimize-icon').classList.remove('rotate-180');

        // Sélectionner le premier contact par défaut s'il n'y en a pas
        if (!chatState.activeContactId && chatState.contacts.length > 0) {
            setActiveContact(chatState.contacts[0].id);
        } else {
            renderContacts();
            renderMessages();
        }
    }

    function closeMessagingWidget() {
        chatState.isOpen = false;
        document.getElementById('messaging-window').classList.add('hidden');
        document.getElementById('messaging-window').classList.remove('flex');
        document.getElementById('toggle-messaging-floating').classList.remove('hidden');
    }

    function minimizeMessagingWidget() {
        chatState.isMinimized = !chatState.isMinimized;
        const windowEl = document.getElementById('messaging-window');
        
        if (chatState.isMinimized) {
            // Réduction
            windowEl.classList.replace("w-[700px]", "w-80");
            windowEl.classList.replace("h-[500px]", "h-14");
            document.getElementById('messaging-content').classList.add('hidden');
            document.getElementById('encryption-badge').classList.add('hidden');
            document.getElementById('messaging-minimized-title').classList.remove('hidden');
            document.getElementById('minimize-icon').classList.add('rotate-180');
            
            // Afficher le nom du contact actif
            const c = chatState.contacts.find(x => x.id === chatState.activeContactId);
            if(c) document.getElementById('messaging-minimized-title').textContent = `Discuter avec ${c.name.split(" ")[0]}`;
        } else {
            // Agrandissement
            windowEl.classList.replace("w-80", "w-[700px]");
            windowEl.classList.replace("h-14", "h-[500px]");
            document.getElementById('messaging-content').classList.remove('hidden');
            document.getElementById('encryption-badge').classList.remove('hidden');
            document.getElementById('messaging-minimized-title').classList.add('hidden');
            document.getElementById('minimize-icon').classList.remove('rotate-180');
            scrollToBottom();
        }
    }

    // =========================================================================
    // RENDU DES LISTES (Contacts & Messages)
    // =========================================================================
    function setActiveContact(contactId) {
        chatState.activeContactId = contactId;
        const contact = chatState.contacts.find(c => c.id === contactId);
        
        // Mettre à jour l'entête
        document.getElementById('active-contact-name').textContent = contact.name;
        document.getElementById('active-contact-role').textContent = contact.role;
        document.getElementById('active-contact-struct').textContent = contact.structure || "";
        
        const dot = document.getElementById('active-contact-status-dot');
        const text = document.getElementById('active-contact-status-text');
        
        if(contact.isOnline) {
            dot.classList.replace('bg-slate-600', 'bg-blue-500');
            dot.classList.replace('bg-slate-400', 'bg-blue-500');
            text.textContent = "EN LIGNE";
            text.classList.replace('text-slate-500', 'text-blue-500');
        } else {
            dot.classList.replace('bg-blue-500', 'bg-slate-500');
            text.textContent = "HORS LIGNE";
            text.classList.replace('text-blue-500', 'text-slate-500');
        }

        renderContacts();
        renderMessages();
    }

    function renderContacts(query = "") {
        const listContainer = document.getElementById('contacts-list');
        const filtered = chatState.contacts.filter(c => 
            c.name.toLowerCase().includes(query.toLowerCase()) || 
            c.role.toLowerCase().includes(query.toLowerCase())
        );

        if (filtered.length === 0) {
            listContainer.innerHTML = `<p class="p-4 text-[10.5px] text-slate-500 italic text-center">Aucun contact trouvé.</p>`;
            return;
        }

        listContainer.innerHTML = filtered.map(c => {
            const isSelected = c.id === chatState.activeContactId;
            const bgClass = isSelected ? "bg-white/5 dark:bg-white/10" : "hover:bg-slate-200 dark:hover:bg-white/[0.02]";
            const nameColor = isSelected ? "text-blue-700 dark:text-white" : "text-slate-800 dark:text-slate-200 group-hover:text-slate-900 dark:group-hover:text-white";
            
            // Simuler des non-lus (statique pour l'exemple)
            const unread = (c.id === "col-2" && chatState.messages[c.id].length <= 2) ? 1 : 0;

            return `
            <button onclick="setActiveContact('${c.id}')" class="w-full p-3 text-left transition-all duration-150 flex items-start gap-2.5 cursor-pointer relative group ${bgClass}">
                <div class="h-8.5 w-8.5 rounded-full flex items-center justify-center text-white text-[10px] font-extrabold shrink-0 relative border border-white/10" style="background-color: ${c.avatarColor}">
                    ${c.name.substring(0,2).toUpperCase()}
                    ${c.isOnline ? '<span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 bg-blue-500 border border-slate-200 dark:border-slate-900 rounded-full"></span>' : ''}
                </div>
                <div class="min-w-0 flex-1">
                    <div class="flex items-center justify-between gap-1.5">
                        <span class="text-[11.5px] font-bold truncate leading-snug ${nameColor}">${c.name}</span>
                        ${unread > 0 ? `<span class="px-1.5 py-0.5 rounded-full text-[8px] font-black shrink-0 bg-blue-600 text-white dark:bg-blue-500 dark:text-black">${unread}</span>` : ''}
                    </div>
                    <p class="text-[9.5px] mt-0.5 truncate font-semibold text-slate-500 dark:text-slate-400">${c.role}</p>
                </div>
            </button>`;
        }).join('');
    }

    function filterContacts(val) {
        renderContacts(val);
    }

    function renderMessages() {
        const container = document.getElementById('messages-container');
        const msgs = chatState.messages[chatState.activeContactId] || [];

        if (msgs.length === 0) {
            container.innerHTML = `<p class="text-[10.5px] text-slate-500 italic py-12 text-center">Début de l'historique sécurisé avec ce contact.</p>`;
            return;
        }

        container.innerHTML = msgs.map(m => {
            const isMe = m.senderId === "me";
            const wrapperClass = isMe ? "justify-end" : "justify-start";
            
            // Classes Tailwind gérant Light/Dark mode
            const bubbleClass = isMe 
                ? "bg-blue-600 text-white dark:bg-blue-500/10 dark:border dark:border-blue-500/25 dark:text-slate-100" 
                : "bg-slate-100 border border-slate-200 text-slate-800 dark:bg-white/[0.03] dark:border-white/5 dark:text-slate-200";
            
            // Si c'est un partage de clause (IsClauseShare)
            let clauseHtml = "";
            if (m.isClauseShare) {
                clauseHtml = `
                <div class="mb-2 pb-2 border-b text-[11px] p-2.5 rounded-lg space-y-1.5 border-l-2 shadow-inner bg-white/60 border-slate-200 border-l-yellow-600 shadow-sm dark:bg-black/40 dark:border-white/10 dark:border-l-yellow-500">
                    <div class="flex items-center gap-1.5 text-yellow-600 dark:text-yellow-400 font-bold font-mono text-[9px] uppercase tracking-wider">
                        <i data-lucide="share-2" class="h-3 w-3"></i> Référence : ${m.clauseCode}
                    </div>
                    <blockquote class="text-[10px] text-slate-600 dark:text-slate-400 italic line-clamp-3 leading-normal border-l border-slate-300 dark:border-white/10 pl-2">
                        "${m.clauseExcerpt}"
                    </blockquote>
                </div>`;
            }

            const timeColor = isMe ? "text-blue-100 dark:text-white/40" : "text-slate-400 dark:text-white/40";
            const checkColor = isMe ? "text-blue-300 dark:text-blue-400" : "";

            return `
            <div class="flex ${wrapperClass} animate-fadeIn">
                <div class="max-w-[85%] rounded-xl px-3.5 py-2.5 text-xs shadow-sm leading-relaxed ${bubbleClass}">
                    ${clauseHtml}
                    <p class="whitespace-pre-wrap">${m.text}</p>
                    <div class="mt-1 flex items-center justify-end gap-1.5 text-[8.5px] ${timeColor}">
                        <span>${m.timestamp}</span>
                        ${isMe ? `<i data-lucide="check-check" class="h-3 w-3 ${checkColor}"></i>` : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
        
        lucide.createIcons();
        scrollToBottom();
    }

    function scrollToBottom() {
        const container = document.getElementById('messages-container');
        container.scrollTop = container.scrollHeight;
    }

    // =========================================================================
    // LOGIQUE D'ENVOI DE MESSAGES (Simulation)
    // =========================================================================
    function handleSendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-input-text');
        const text = input.value.trim();
        if (!text) return;

        // Ajouter mon message
        const timeStr = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        const newMsg = {
            id: `msg-${Date.now()}`,
            senderId: "me",
            senderName: chatState.myProfile.name,
            text: text,
            timestamp: timeStr
        };

        if(!chatState.messages[chatState.activeContactId]) {
            chatState.messages[chatState.activeContactId] = [];
        }
        chatState.messages[chatState.activeContactId].push(newMsg);

        // Vider l'input et re-rendre
        input.value = "";
        document.getElementById('send-msg-btn').disabled = true;
        renderMessages();

        // Réponse simulée du contact
        simulateReply(chatState.activeContactId);
    }

    function simulateReply(contactId) {
        setTimeout(() => {
            const timeStr = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
            const replyMsg = {
                id: `rep-${Date.now()}`,
                senderId: contactId,
                senderName: chatState.contacts.find(c => c.id === contactId).name,
                text: "Message bien reçu sur le canal sécurisé. Je valide de mon côté.",
                timestamp: timeStr
            };
            
            chatState.messages[contactId].push(replyMsg);
            
            // Si la fenêtre est ouverte sur ce contact, on met à jour
            if (chatState.isOpen && chatState.activeContactId === contactId) {
                renderMessages();
            } else {
                // Sinon on incrémente le badge global (Notification)
                const badge = document.getElementById('unread-badge');
                badge.textContent = parseInt(badge.textContent || 0) + 1;
                if(!chatState.isOpen) document.getElementById('toggle-messaging-floating').classList.add('animate-bounce');
            }
        }, 2000);
    }

    // =========================================================================
    // APPEL EXTERNE (Partage depuis l'Editeur)
    // =========================================================================
    // Cette fonction peut être appelée depuis l'onglet `editor`
    window.shareClauseToChat = function(recipientId, code, excerpt) {
        const timeStr = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        const shareMsg = {
            id: `share-${Date.now()}`,
            senderId: "me",
            senderName: chatState.myProfile.name,
            text: `📢 J'ai partagé cette clause pour examen.`,
            timestamp: timeStr,
            isClauseShare: true,
            clauseCode: code,
            clauseExcerpt: excerpt
        };

        if(!chatState.messages[recipientId]) chatState.messages[recipientId] = [];
        chatState.messages[recipientId].push(shareMsg);

        openMessagingWidget();
        setActiveContact(recipientId);
        
        // Simule la réponse automatique pour le partage
        simulateReply(recipientId);
    };

    // Initialisation
    setTimeout(() => { lucide.createIcons(); }, 100);

</script>
