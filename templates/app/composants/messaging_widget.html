<div id="messaging-widget-container" class="fixed bottom-6 right-6 z-50">
    
    <button
        id="toggle-messaging-floating"
        onclick="openMessagingWidget()"
        class="font-bold h-14 w-14 justify-center md:w-auto md:justify-start md:px-4 md:py-3 rounded-full flex items-center gap-3.5 shadow-[0_10px_30px_rgba(0,0,0,0.5)] cursor-pointer group hover:scale-105 transition-all text-xs tracking-wider uppercase backdrop-blur-md bg-white border border-blue-300 text-blue-600 hover:border-blue-400 hover:text-blue-700 dark:bg-[#020204] dark:border-blue-500/30 dark:text-blue-400 dark:hover:border-blue-400 dark:hover:text-blue-300"
    >
        <div class="relative">
            <i data-lucide="message-square" class="h-5 w-5 fill-blue-100 dark:fill-blue-500/10 group-hover:animate-pulse"></i>
            <span id="unread-badge" class="hidden absolute -top-2.5 -right-2.5 min-h-4.5 min-w-4.5 px-1 rounded-full bg-red-500 text-white font-extrabold text-[9px] items-center justify-center animate-bounce shadow-md">
                0
            </span>
        </div>
        <span class="hidden md:inline font-sans font-bold select-none">Messagerie CNE-ITP</span>
        <span class="hidden md:inline-block h-2 w-2 rounded-full animate-pulse bg-blue-500"></span>
    </button>

    <div
        id="messaging-window"
        class="hidden border rounded-2xl shadow-[0_20px_50px_rgba(37,99,235,0.15)] dark:shadow-[0_20px_50px_rgba(0,0,0,0.8)] flex-col backdrop-blur-xl transition-all duration-300 fixed bottom-6 right-6 w-[700px] h-[500px] max-w-[calc(100vw-2rem)] max-h-[calc(100vh-2rem)] max-md:!inset-3 max-md:!w-auto max-md:!h-auto max-md:!max-w-none max-md:!max-h-none bg-white/95 border-blue-200 text-blue-900 dark:bg-[#020204]/95 dark:border-white/10 dark:text-slate-300 z-50"
    >
        <div class="h-14 border-b px-4.5 flex items-center justify-between shrink-0 rounded-t-2xl border-blue-200 bg-blue-50/80 dark:border-white/10 dark:bg-black/40">
            <div class="flex items-center gap-2.5">
                <div class="h-8 w-8 rounded-lg flex items-center justify-center border bg-blue-100 text-blue-600 border-blue-300 dark:bg-blue-500/15 dark:border-blue-500/30 dark:text-blue-400">
                    <i data-lucide="message-square" class="h-4 w-4"></i>
                </div>
                <div>
                    <h3 class="text-xs font-extrabold uppercase tracking-wider flex items-center gap-2 text-slate-800 dark:text-white">
                        Messagerie Sécurisée CNE-ITP
                        <span id="encryption-badge" class="text-[9px] font-bold px-2 py-0.5 rounded-full font-mono bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-400">
                            SÉCURISÉ (AES-256)
                        </span>
                    </h3>
                    <p id="messaging-minimized-title" class="hidden text-[10px] text-slate-500 font-medium">Discuter avec ...</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="minimizeMessagingWidget()" class="p-1.5 rounded-md text-slate-500 hover:text-slate-800 hover:bg-slate-200 dark:hover:text-white dark:hover:bg-white/5 transition-all cursor-pointer" title="Réduire">
                    <i id="minimize-icon" data-lucide="chevron-down" class="h-4 w-4 transition-transform"></i>
                </button>
                <button onclick="closeMessagingWidget()" class="p-1.5 rounded-md text-slate-500 hover:text-slate-800 hover:bg-slate-200 dark:hover:text-white dark:hover:bg-white/5 transition-all cursor-pointer" title="Fermer">
                    <i data-lucide="x" class="h-4 w-4"></i>
                </button>
            </div>
        </div>

        <div id="messaging-content" class="flex-1 min-h-0 flex bg-transparent">
            
            <div id="messaging-contacts-panel" class="w-64 max-md:w-full border-r border-slate-200 dark:border-white/10 flex flex-col h-full bg-slate-50/50 dark:bg-black/25 shrink-0">
                <div class="p-3 border-b border-slate-200 dark:border-white/10">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-2.5 top-2.5 h-3 w-3 text-slate-500"></i>
                        <input 
                            type="text" 
                            placeholder="Chercher un interlocuteur..." 
                            oninput="filterContacts(this.value)" 
                            class="w-full pl-8 pr-3 py-1.5 rounded-lg border focus:outline-hidden focus:ring-1 transition-all bg-white border-slate-300 text-slate-800 focus:border-blue-400 focus:ring-blue-100 dark:border-white/5 dark:bg-black/45 text-[11px] dark:text-white font-medium dark:focus:border-blue-500/30"
                        />
                    </div>
                </div>
                <div id="contacts-list" class="flex-1 overflow-y-auto divide-y divide-slate-200 dark:divide-white/5 scrollbar-none">
                    </div>
            </div>

            <div id="messaging-chat-panel" class="flex-1 flex flex-col h-full bg-white dark:bg-black/10">

                <div class="px-4.5 py-3 border-b border-blue-100 bg-white/50 dark:bg-black/15 dark:border-white/5 flex items-center justify-between shrink-0">
                    <div class="min-w-0 flex items-center gap-2">
                        <button onclick="setMessagingMobileView('contacts')" class="md:hidden shrink-0 p-1.5 -ml-1 rounded-md text-slate-500 hover:bg-slate-200 dark:hover:bg-white/5 transition-all cursor-pointer" title="Retour aux contacts">
                            <i data-lucide="arrow-left" class="h-4 w-4"></i>
                        </button>
                        <div class="min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <h4 id="active-contact-name" class="text-xs font-extrabold truncate text-slate-900 dark:text-white">...</h4>
                                <span id="active-contact-status-dot" class="h-1.5 w-1.5 rounded-full bg-slate-400 dark:bg-slate-600"></span>
                                <span id="active-contact-status-text" class="text-[9px] font-mono font-bold uppercase text-slate-500">Hors ligne</span>
                            </div>
                            <p class="text-[10px] truncate mt-0.5 font-medium text-slate-600 dark:text-slate-400">
                                <span id="active-contact-role"></span> • <span id="active-contact-struct" class="font-semibold text-blue-700 dark:text-blue-400"></span>
                            </p>
                        </div>
                    </div>
                </div>

                <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-none bg-slate-50/50 dark:bg-[#020204]/30">
                    </div>

                <form onsubmit="handleSendMessage(event)" class="p-3 border-t shrink-0 bg-slate-50 border-blue-200 dark:border-white/10 dark:bg-black/30">
                    <div class="flex items-center gap-2">
                        <input 
                            type="text" 
                            id="chat-input-text" 
                            placeholder="Écrire un message..." 
                            oninput="document.getElementById('send-msg-btn').disabled = !this.value.trim()" 
                            class="flex-1 text-xs px-3.5 py-2.5 rounded-lg border focus:outline-hidden focus:ring-2 font-medium transition-colors bg-white border-slate-300 text-slate-800 placeholder-slate-400 focus:border-blue-400 focus:ring-blue-100 dark:border-white/5 dark:bg-black/50 dark:text-white dark:placeholder-slate-600 dark:focus:border-blue-500/40 dark:focus:ring-blue-500/5"
                        />
                        <button 
                            type="submit" 
                            id="send-msg-btn" 
                            disabled 
                            class="h-9.5 w-9.5 rounded-lg flex items-center justify-center shrink-0 disabled:opacity-40 transition-all cursor-pointer shadow-md bg-blue-600 hover:bg-blue-700 text-white dark:bg-blue-500 dark:hover:bg-blue-400 dark:text-black"
                        >
                            <i data-lucide="send" class="h-3.5 w-3.5"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    // =========================================================================
    // ÉTAT — connecté à l'API CNE-ITP
    // =========================================================================
    if (typeof window.chatState === 'undefined') {
        window.chatState = {
            isOpen: false,
            isMinimized: false,
            activeContactId: null,
            myId: '{{ user_id }}',
            searchQuery: '',
            contacts: [],
            messages: {},
            unreadCount: 0,
            pollTimer: null,
        };
    }
    var chatState = window.chatState;

    // =========================================================================
    // UTILITAIRES
    // =========================================================================
    function getCsrfToken() {
        var match = document.cookie.split(';')
            .map(function(c) { return c.trim(); })
            .find(function(c) { return c.startsWith('csrftoken='); });
        return match ? decodeURIComponent(match.split('=')[1]) : '';
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // Sous 768px, contacts et conversation se partagent l'écran à tour de rôle
    // (sinon la colonne de contacts fixe écrase la conversation en largeur).
    window.setMessagingMobileView = function(view) {
        if (!window.matchMedia('(max-width: 767px)').matches) return;
        var contactsPanel = document.getElementById('messaging-contacts-panel');
        var chatPanel = document.getElementById('messaging-chat-panel');
        if (!contactsPanel || !chatPanel) return;
        if (view === 'contacts') {
            contactsPanel.classList.remove('hidden');
            contactsPanel.classList.add('flex');
            chatPanel.classList.add('hidden');
            chatPanel.classList.remove('flex');
        } else {
            contactsPanel.classList.add('hidden');
            contactsPanel.classList.remove('flex');
            chatPanel.classList.remove('hidden');
            chatPanel.classList.add('flex');
        }
    };

    // =========================================================================
    // APPELS API
    // =========================================================================
    async function loadContacts() {
        try {
            await window.withButtonLoading(null, async function() {
                var r = await window.fetchWithTimeout('/api/v1/messages/contacts/', {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                if (!r.ok) return;
                var data = await r.json();
                chatState.contacts = data.map(function(e) {
                    return {
                        id: e.user_id || (e.user && e.user.id),
                        name: e.user_name || (e.user && e.user.full_name) || 'Expert',
                        role: e.role || 'Expert CTM',
                        structure: (e.structure && e.structure.acronym) || e.structure_name || '',
                        isOnline: (e.user && e.user.is_online) || false,
                        avatarColor: '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'),
                    };
                }).filter(function(c) { return c.id; });
                renderContacts();
            });
        } catch(e) { console.error('loadContacts:', e); }
    }

    async function loadMessages(contactId) {
        if (!contactId) return;
        try {
            var r = await window.fetchWithTimeout('/api/v1/messages/?participant_id=' + contactId, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            if (!r.ok) return;
            var data = await r.json();
            chatState.messages[contactId] = Array.isArray(data) ? data : (data.results || []);
            await markConversationAsRead(contactId);
            await loadUnreadCount();
        } catch(e) {
            console.error('loadMessages:', e);
            chatState.messages[contactId] = [];
        } finally {
            renderMessages();
        }
    }

    async function markConversationAsRead(contactId) {
        if (!contactId) return;
        try {
            await window.fetchWithTimeout('/api/v1/messages/mark_conversation_as_read/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                    'X-Requested-With': 'XMLHttpRequest',
                },
                body: JSON.stringify({ participant_id: contactId }),
            });
        } catch(e) { /* silencieux */ }
    }

    async function loadUnreadCount() {
        try {
            var r = await window.fetchWithTimeout('/api/v1/messages/unread_count/', {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            var data = r.ok ? await r.json() : {};
            chatState.unreadCount = data.unread_count || 0;
        } catch(e) {
            chatState.unreadCount = 0;
        } finally {
            renderUnreadBadge();
        }
    }

    // =========================================================================
    // RENDU
    // =========================================================================
    function renderUnreadBadge() {
        var badge = document.getElementById('unread-badge');
        if (!badge) return;
        if (chatState.unreadCount > 0) {
            badge.textContent = chatState.unreadCount > 99 ? '99+' : chatState.unreadCount;
            badge.classList.remove('hidden');
            badge.classList.add('flex');
        } else {
            badge.classList.add('hidden');
            badge.classList.remove('flex');
        }
    }

    function renderContacts(query) {
        var el = document.getElementById('contacts-list');
        if (!el) return;
        var q = (query !== undefined ? query : chatState.searchQuery || '').toLowerCase();
        var filtered = chatState.contacts.filter(function(c) {
            return c.name.toLowerCase().includes(q) ||
                   c.role.toLowerCase().includes(q) ||
                   (c.structure || '').toLowerCase().includes(q);
        });

        if (!filtered.length) {
            el.innerHTML = '<p class="p-4 text-[10.5px] text-slate-500 italic text-center">Aucun contact trouvé.</p>';
            return;
        }

        el.innerHTML = filtered.map(function(c) {
            var isSelected = String(c.id) === String(chatState.activeContactId);
            var bgClass = isSelected ? 'bg-white/5 dark:bg-white/10' : 'hover:bg-slate-100 dark:hover:bg-white/[0.02]';
            var nameColor = isSelected ? 'text-blue-700 dark:text-white' : 'text-slate-800 dark:text-slate-200';
            var initials = c.name.split(' ').map(function(n) { return n[0]; }).join('').substring(0, 2).toUpperCase();
            var onlineDot = c.isOnline ? '<span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 bg-blue-500 border border-slate-200 dark:border-slate-900 rounded-full"></span>' : '';

            return '<button onclick="setActiveContact(\'' + c.id + '\')" class="w-full p-3 text-left transition-all duration-150 flex items-start gap-2.5 cursor-pointer relative group ' + bgClass + '">' +
                '<div class="h-8.5 w-8.5 rounded-full flex items-center justify-center text-white text-[10px] font-extrabold shrink-0 relative border border-white/10" style="background-color:' + escHtml(c.avatarColor) + '">' +
                    initials + onlineDot +
                '</div>' +
                '<div class="min-w-0 flex-1">' +
                    '<span class="text-[11.5px] font-bold truncate block leading-snug ' + nameColor + '">' + escHtml(c.name) + '</span>' +
                    '<p class="text-[9.5px] mt-0.5 truncate font-semibold text-slate-500 dark:text-slate-400">' + escHtml(c.role) + '</p>' +
                    (c.structure ? '<p class="text-[8px] mt-0.5 font-mono text-slate-400 dark:text-slate-500">' + escHtml(c.structure) + '</p>' : '') +
                '</div>' +
            '</button>';
        }).join('');
    }

    function renderMessages() {
        var container = document.getElementById('messages-container');
        if (!container) return;
        var msgs = chatState.messages[chatState.activeContactId] || [];

        if (!msgs.length) {
            container.innerHTML = '<p class="text-[10.5px] text-slate-500 italic py-12 text-center">Début de l\'historique sécurisé avec ce contact.</p>';
            return;
        }

        container.innerHTML = msgs.map(function(m) {
            var senderId = m.sender || m.senderId || '';
            var isMe = String(senderId) === String(chatState.myId) || senderId === 'me';
            var wrapperClass = isMe ? 'justify-end' : 'justify-start';
            var bubbleClass = isMe
                ? 'bg-blue-600 text-white dark:bg-blue-500/10 dark:border dark:border-blue-500/25 dark:text-slate-100'
                : 'bg-slate-100 border border-slate-200 text-slate-800 dark:bg-white/[0.03] dark:border-white/5 dark:text-slate-200';
            var timeColor = isMe ? 'text-blue-100 dark:text-white/40' : 'text-slate-400 dark:text-white/40';
            var checkIcon = isMe ? '<i data-lucide="check-check" class="h-3 w-3 text-blue-300 dark:text-blue-400"></i>' : '';

            var rawTime = m.timestamp || '';
            var timeStr = rawTime;
            if (rawTime && rawTime.includes('T')) {
                try { timeStr = new Date(rawTime).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); } catch(e) {}
            }

            var isClause = m.is_clause_share || m.isClauseShare;
            var clauseCode = escHtml(m.clause_code || m.clauseCode || '');
            var clauseExcerpt = escHtml(m.clause_excerpt || m.clauseExcerpt || '');
            var content = escHtml(m.content || m.text || '');

            var clauseHtml = '';
            if (isClause) {
                clauseHtml = '<div class="mb-2 pb-2 border-b text-[11px] p-2.5 rounded-lg space-y-1.5 border-l-2 bg-white/60 border-slate-200 border-l-yellow-600 dark:bg-black/40 dark:border-white/10 dark:border-l-yellow-500">' +
                    '<div class="flex items-center gap-1.5 text-yellow-600 dark:text-yellow-400 font-bold font-mono text-[9px] uppercase tracking-wider">' +
                        '<i data-lucide="share-2" class="h-3 w-3"></i> Clause : ' + clauseCode +
                    '</div>' +
                    (clauseExcerpt ? '<blockquote class="text-[10px] text-slate-500 dark:text-slate-400 italic line-clamp-3 leading-normal border-l border-slate-300 dark:border-white/10 pl-2">&ldquo;' + clauseExcerpt + '&rdquo;</blockquote>' : '') +
                '</div>';
            }

            return '<div class="flex ' + wrapperClass + ' animate-fadeIn w-full">' +
                '<div class="max-w-[85%] rounded-xl px-3.5 py-2.5 text-xs shadow-sm leading-relaxed ' + bubbleClass + '">' +
                    clauseHtml +
                    '<p class="whitespace-pre-wrap">' + content + '</p>' +
                    '<div class="mt-1 flex items-center justify-end gap-1.5 text-[8.5px] ' + timeColor + '">' +
                        '<span>' + escHtml(String(timeStr)) + '</span>' +
                        checkIcon +
                    '</div>' +
                '</div>' +
            '</div>';
        }).join('');

        lucide.createIcons();
        scrollToBottom();
    }

    function scrollToBottom() {
        var el = document.getElementById('messages-container');
        if (el) el.scrollTop = el.scrollHeight;
    }

    function filterContacts(val) {
        chatState.searchQuery = val;
        renderContacts(val);
    }

    // =========================================================================
    // ACTIONS UI
    // =========================================================================
    async function openMessagingWidget() {
        chatState.isOpen = true;
        chatState.isMinimized = false;

        document.getElementById('toggle-messaging-floating').classList.add('hidden');
        var windowEl = document.getElementById('messaging-window');
        windowEl.classList.remove('hidden');
        windowEl.classList.add('flex');
        windowEl.classList.replace('w-80', 'w-[700px]');
        windowEl.classList.replace('h-14', 'h-[500px]');
        document.getElementById('messaging-content').classList.remove('hidden');
        document.getElementById('encryption-badge').classList.remove('hidden');
        document.getElementById('messaging-minimized-title').classList.add('hidden');
        document.getElementById('minimize-icon').classList.remove('rotate-180');

        await loadContacts();
        await loadUnreadCount();

        if (chatState.activeContactId) {
            await setActiveContact(chatState.activeContactId);
        } else if (chatState.contacts.length > 0) {
            await setActiveContact(chatState.contacts[0].id);
        } else {
            window.setMessagingMobileView('contacts');
            renderContacts();
            renderMessages();
        }
    }

    function closeMessagingWidget() {
        chatState.isOpen = false;
        chatState.isMinimized = false;
        var windowEl = document.getElementById('messaging-window');
        windowEl.classList.add('hidden');
        windowEl.classList.remove('flex');
        document.getElementById('toggle-messaging-floating').classList.remove('hidden');
        loadUnreadCount();
    }

    function minimizeMessagingWidget() {
        chatState.isMinimized = !chatState.isMinimized;
        const windowEl = document.getElementById('messaging-window');
        
        if (chatState.isMinimized) {
            windowEl.classList.replace("w-[700px]", "w-80");
            windowEl.classList.replace("h-[500px]", "h-14");
            document.getElementById('messaging-content').classList.add('hidden');
            document.getElementById('encryption-badge').classList.add('hidden');
            document.getElementById('messaging-minimized-title').classList.remove('hidden');
            document.getElementById('minimize-icon').classList.add('rotate-180');
        } else {
            windowEl.classList.replace("w-80", "w-[700px]");
            windowEl.classList.replace("h-14", "h-[500px]");
            document.getElementById('messaging-content').classList.remove('hidden');
            document.getElementById('encryption-badge').classList.remove('hidden');
            document.getElementById('messaging-minimized-title').classList.add('hidden');
            document.getElementById('minimize-icon').classList.remove('rotate-180');
            scrollToBottom();
        }
    }

    async function setActiveContact(contactId) {
        chatState.activeContactId = String(contactId);
        var contact = chatState.contacts.find(function(c) { return String(c.id) === String(contactId); });

        if (contact) {
            document.getElementById('active-contact-name').textContent = contact.name;
            document.getElementById('active-contact-role').textContent = contact.role;
            document.getElementById('active-contact-struct').textContent = contact.structure || '';
            var dot = document.getElementById('active-contact-status-dot');
            var txt = document.getElementById('active-contact-status-text');
            if (contact.isOnline) {
                dot.className = 'h-1.5 w-1.5 rounded-full bg-blue-500';
                txt.textContent = 'EN LIGNE';
            } else {
                dot.className = 'h-1.5 w-1.5 rounded-full bg-slate-400 dark:bg-slate-600';
                txt.textContent = 'HORS LIGNE';
            }
            if (chatState.isMinimized) {
                document.getElementById('messaging-minimized-title').textContent = 'Discuter avec ' + contact.name.split(' ')[0];
            }
            window.setMessagingMobileView('chat');
        }

        renderContacts();
        await loadMessages(contactId);
    }

    async function handleSendMessage(e) {
        e.preventDefault();
        var input = document.getElementById('chat-input-text');
        var text = input.value.trim();
        if (!text || !chatState.activeContactId) return;

        var btn = document.getElementById('send-msg-btn');

        try {
            await window.withButtonLoading(btn, async function() {
                var r = await window.fetchWithTimeout('/api/v1/messages/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken(),
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                    body: JSON.stringify({
                        receiver_id: chatState.activeContactId,
                        content: text,
                    }),
                });
                if (!r.ok) throw new Error('Échec envoi');
                var msg = await r.json();
                if (!chatState.messages[chatState.activeContactId]) chatState.messages[chatState.activeContactId] = [];
                chatState.messages[chatState.activeContactId].push(msg);
                input.value = '';
                renderMessages();
                await loadUnreadCount();
            });
        } catch(err) {
            console.error(err);
        }
    }

    // =========================================================================
    // EXPORTS pour editor_area.html
    // =========================================================================
    // Exports globaux — écrasent les éventuelles définitions précédentes de app.html
    window.openMessagingWidget    = openMessagingWidget;
    window.closeMessagingWidget   = closeMessagingWidget;
    window.minimizeMessagingWidget = minimizeMessagingWidget;
    window.setActiveContact       = setActiveContact;
    window.filterContacts         = filterContacts;
    window.handleSendMessage      = handleSendMessage;

    window.shareClauseToChat = async function(recipientId, code, excerpt) {
        var parts = ['📋 Clause partagée [' + code + ']'];
        if (excerpt && excerpt.trim()) parts.push('\n« ' + excerpt.trim() + ' »');

        try {
            var r = await window.fetchWithTimeout('/api/v1/messages/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                    'X-Requested-With': 'XMLHttpRequest',
                },
                body: JSON.stringify({
                    receiver_id: recipientId,
                    content: parts.join(''),
                    is_clause_share: true,
                    clause_code: code,
                    clause_excerpt: excerpt || '',
                }),
            });
            if (r.ok) {
                var msg = await r.json();
                var rid = String(recipientId);
                if (!chatState.messages[rid]) chatState.messages[rid] = [];
                chatState.messages[rid].push(msg);
            }
        } catch(err) {
            console.error('shareClauseToChat:', err);
        }

        if (!chatState.isOpen) await openMessagingWidget();
        await setActiveContact(recipientId);
    };

    // =========================================================================
    // INITIALISATION & POLLING
    // =========================================================================
    setTimeout(function() {
        lucide.createIcons();
        loadUnreadCount();
        if (!chatState.pollTimer) {
            chatState.pollTimer = setInterval(async function() {
                await loadUnreadCount();
                if (chatState.isOpen && !chatState.isMinimized && chatState.activeContactId) {
                    await loadMessages(chatState.activeContactId);
                }
            }, 15000);
        }
    }, 100);

})();
</script>
