<script>
    // =========================================================================
    // 1. ÉTAT GLOBAL DE LA SIDEBAR (Simulation API)
    // =========================================================================
    window.sidebarState = window.sidebarState || {
        activeTab: 'experts', // Défini par défaut sur experts pour voir le résultat
        searchQuery: '',
        selectedDocId: null,
        selectedWgId: null,
        selectedExpertId: null,
        expertSelectionType: 'wg', // 'wg' ou 'expert' ou 'pending'
        historyAuthorFilter: null,
        userRole: 'ADMIN',
        
        // Simuler un profil connecté
        testProfile: {
            email: "masamba@cnetp.cd",
            roleId: "ADMIN"
        },
        
        // Données complètes issues du React
        documents: [
            { id: "doc-1", code: "Pr-RDC 9001", title: "ISO 9001 - Révision RDC", category: "Qualité", updatedBy: "Masamba" },
            { id: "doc-2", code: "Pr-RDC 27001", title: "Sécurité de l'information", category: "Sécurité", updatedBy: "Lukusa" }
        ],
        workingGroups: [
            { id: "wg-8.1", code: "WG 8.1", title: "Matériaux Locaux (CTM 8)", tag: "Actif" },
            { id: "wg-1.2", code: "WG 1.2", title: "Stabilité Sols (CTM 1)", tag: "Rédaction" }
        ],
        experts: [
            { id: "exp-1", name: "Prof. Masamba Édouard", role: "Président scientifique", structure: "UNIKIN", email: "masamba@cnetp.cd", ctm: "CTM 8", wg: "WG 8.1", isApproved: true },
            { id: "exp-2", name: "Ir. Chantal Mwamba", role: "Secrétaire", structure: "OVD", email: "chantal@cnetp.cd", ctm: "CTM 5", wg: "WG 5.1", isApproved: true },
            { id: "exp-3", name: "Arch. Sylvain Lukusa", role: "Rapporteur", structure: "ONA", email: "sylvain@cnetp.cd", ctm: "CTM 3", wg: "WG 3.2", isApproved: false }
        ],
        currentCtmId: null,
        currentCtmName: "",
        collaborators: [
            { id: "col-1", name: "Prof. Masamba Édouard", role: "Expert Rédacteur", email: "masamba@cnetp.cd", avatarColor: "#3b82f6", isActive: true },
            { id: "col-2", name: "Marie Laurent", role: "Coordinateur CTC", email: "marie@cnetp.cd", avatarColor: "#ec4899", isActive: false }
        ],
        historyEditors: [
            { email: "masamba@cnetp.cd", name: "Prof. Masamba Édouard", role: "Expert Rédacteur", avatarColor: "#3b82f6", count: 12 },
            { email: "chantal@cnetp.cd", name: "Ir. Chantal Mwamba", role: "Secrétaire", avatarColor: "#14b8a6", count: 3 }
        ],
        meetings: [
            { id: "m-1", title: "Session CTM 8 - Argiles", date: "20 Mai 2026", status: "Terminé" },
            { id: "m-2", title: "Concertation ITP", date: "24 Mai 2026", status: "En cours" }
        ],
        budgets: [
            { id: "b-1", title: "Cotisation Annuelle OCC", amount: "78,500 CDF", status: "Payé" },
            { id: "b-2", title: "Fonds ITP Secrétariat", amount: "125,000 CDF", status: "Validé" }
        ],
        validationSteps: [
            { id: "s-1", title: "1. Enquête Publique 90 J.", desc: "Recueil des avis publics" },
            { id: "s-2", title: "2. Conformité Formulation", desc: "Relit technique légistique" }
        ]
    };

    // --- FONCTIONS UTILITAIRES POUR EXPERTS ---
    const getCmtNumber = (ctmStr) => {
        if (!ctmStr) return null;
        const match = ctmStr.match(/CTM\s*(\d+)/i);
        return match ? match[1] : null;
    };

    const getWgCmtNumber = (wgCodeStr) => {
        if (!wgCodeStr) return null;
        const match = wgCodeStr.match(/(?:WG|wg)\s*(\d+)\.?/i);
        return match ? match[1] : null;
    };

    const NORM_TYPE_LABELS = {
        NCD: "Norme Nationale",
        CA: "Code Applicatif",
        DIR: "Directive",
        REC: "Recommandation",
    };

    const getParallelNormsForWg = (wgId) => {
        if (!wgId) return [];
        return (sidebarState.documents || [])
            .filter(doc => doc.wg != null && String(doc.wg) === String(wgId))
            .map(doc => `${doc.code} (${doc.title})`);
    };

    // --- FONCTION PRINCIPALE DE RENDU ---
    function renderSidebarContent(tab = null) {
        if (tab) sidebarState.activeTab = tab;
        const topSection = document.getElementById('sidebar-top-section');
        const bottomSection = document.getElementById('sidebar-bottom-section');
        const isDark = document.documentElement.classList.contains('dark');
        
        let topHtml = '';
        let bottomHtml = '';

        // ==========================================
        // 1. RENDU DE LA SECTION HAUTE (TOP)
        // ==========================================
        
        if (sidebarState.activeTab === 'editor') {
            topHtml = `
                <div class="flex items-center justify-between mb-3 px-2">
                    <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                        <i data-lucide="file-text" class="h-3.5 w-3.5 text-slate-400"></i> Documents / Normes
                    </h2>
                    <button onclick="handleAddAction('doc')" class="text-[10px] font-bold px-2 py-1 rounded transition-all flex items-center gap-1 cursor-pointer shadow-xs border ${isDark ? 'text-blue-400 hover:text-white bg-blue-500/10 hover:bg-blue-500/20 border-blue-500/20' : 'text-blue-600 hover:bg-blue-100 bg-blue-50 border-blue-200'}">
                        <i data-lucide="plus" class="h-3 w-3 inline"></i> Nouveau
                    </button>
                </div>
                <div class="space-y-1">
                    ${sidebarState.documents.map(doc => {
                        const isSelected = doc.id === sidebarState.selectedDocId;
                        const bgClass = isSelected ? (isDark ? 'bg-blue-600/15 border-blue-500/30 text-blue-300 shadow-xs font-bold' : 'bg-blue-50 border-blue-200 text-blue-800 shadow-xs font-bold') : (isDark ? 'bg-transparent border-transparent hover:bg-white/5 hover:border-white/5 text-slate-400 hover:text-white' : 'bg-transparent border-transparent hover:bg-slate-100 hover:border-slate-100 text-slate-600 hover:text-slate-900');
                        const catColor = doc.category === 'Qualité' ? (isDark ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-white/5 text-slate-300 border-white/10') : (isDark ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-white/5 text-slate-300 border-white/10');
                        const isMyWgDoc = doc.wg != null && sidebarState.currentWgId != null && String(doc.wg) === String(sidebarState.currentWgId);

                        return `
                        <button onclick="sidebarSelect('doc', '${doc.id}')" class="w-full text-left p-3.5 rounded-lg border transition-all duration-200 flex flex-col gap-1.5 leading-tight ${bgClass}">
                            <div class="flex items-start justify-between gap-2 w-full">
                                <span class="font-semibold text-xs truncate max-w-[150px] ${isSelected ? (isDark ? 'text-white' : 'text-blue-950') : (isDark ? 'text-slate-300' : 'text-slate-700')}">${doc.title}</span>
                                <div class="flex items-center gap-1 shrink-0">
                                    ${isMyWgDoc ? `<span class="text-[8.5px] px-1 rounded font-extrabold uppercase border ${isDark ? 'bg-blue-500/15 text-blue-400 border-blue-500/20' : 'bg-blue-100 text-blue-700 border-blue-200'}">Mon WG</span>` : ''}
                                    <span class="text-[9.5px] px-1.5 py-0.5 rounded-full font-bold border ${catColor}">${doc.category}</span>
                                </div>
                            </div>
                            <div class="flex items-center justify-between text-[10px] text-slate-500">
                                <span class="font-mono ${isDark ? 'bg-white/5 border-white/5 text-slate-400' : 'bg-slate-100 border-slate-200 text-slate-600'} border px-1.5 rounded font-semibold">${doc.code}</span>
                                <span class="truncate max-w-[100px]">${doc.updatedBy}</span>
                            </div>
                        </button>`;
                    }).join('')}
                </div>
            `;
        } 
        else if (sidebarState.activeTab === 'experts') {
            const query = (sidebarState.searchQuery || "").toLowerCase();
            
            // Trouver l'expert simulé pour comparer les droits
            const currentExpert = sidebarState.testProfile 
                ? sidebarState.experts.find(e => e.email && e.email.toLowerCase() === sidebarState.testProfile.email.toLowerCase()) 
                : sidebarState.experts.find(e => e.id === "exp-1");
            const currentExpertCmtNum = currentExpert ? getCmtNumber(currentExpert.ctm) : null;

            const filteredWgs = sidebarState.workingGroups.filter(wg => 
                wg.code.toLowerCase().includes(query) || wg.title.toLowerCase().includes(query)
            );

            topHtml = `
                <div class="px-2 mb-4 relative">
                    <i data-lucide="search" class="absolute left-3 top-2.5 h-3.5 w-3.5 text-slate-500"></i>
                    <input type="text" placeholder="Rechercher groupe ou expert..." oninput="updateSearch(this.value)" value="${sidebarState.searchQuery}" class="w-full pl-9 pr-4 py-2 rounded-lg border ${isDark ? 'border-white/10 bg-black/55 text-white placeholder-slate-500' : 'border-slate-300 bg-white text-slate-800 placeholder-slate-400'} text-xs focus:outline-hidden font-semibold" />
                </div>
                ${sidebarState.currentCtmName ? `<p class="text-[10px] text-slate-500 px-2 mb-2 truncate">CTM : ${sidebarState.currentCtmName}</p>` : ''}
                
                <div class="flex items-center justify-between mb-3 px-2">
                    <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                        <i data-lucide="award" class="h-3.5 w-3.5 text-slate-400"></i> Groupes de Travail (WG)
                    </h2>
                </div>
                
                <div class="space-y-1.5">
                    ${filteredWgs.length === 0 ? `
                        <p class="text-[11px] text-slate-500 italic p-3 text-center border border-dashed rounded-lg ${isDark ? 'border-white/5' : 'border-slate-300'}">Aucun groupe trouvé.</p>
                    ` : filteredWgs.map(wg => {
                        const isSelected = sidebarState.expertSelectionType === 'wg' && wg.id === sidebarState.selectedWgId;
                        const wgCmtNum = getWgCmtNumber(wg.code);
                        const isSameCmt = currentExpertCmtNum && wgCmtNum ? currentExpertCmtNum === wgCmtNum : false;
                        const isMyWg = currentExpert?.wg && wg.code ? currentExpert.wg.toLowerCase().includes(wg.code.toLowerCase()) : false;
                        const parallelNorms = getParallelNormsForWg(wg.id);

                        const bgClass = isSelected 
                            ? (isDark ? "bg-blue-500/10 border-blue-500/35 text-blue-400 shadow-[0_4px_12px_rgba(16,185,129,0.05)]" : "bg-blue-50 border-blue-300 text-blue-800 shadow-sm") 
                            : (isDark ? "bg-white/[0.02] hover:bg-white/[0.05] border-white/5 hover:border-white/10 text-slate-300" : "bg-white border-slate-200 hover:bg-slate-50 text-slate-700");
                        
                        const codeClass = isSelected
                            ? (isDark ? "bg-blue-500/20 text-blue-300 border-blue-500/30" : "bg-blue-100 text-blue-800 border-blue-300")
                            : (isDark ? "bg-blue-500/10 text-blue-400 border-blue-500/20" : "bg-slate-100 text-slate-600 border-slate-200");

                        return `
                        <button type="button" onclick="sidebarSelect('wg', '${wg.id}')" class="w-full p-3 rounded-lg border transition-all duration-200 text-left block cursor-pointer ${bgClass}">
                            <div class="flex items-center justify-between gap-1.5">
                                <div class="flex items-center gap-1.5">
                                    <span class="font-mono text-[9.5px] font-bold px-1.5 rounded border ${codeClass}">${wg.code}</span>
                                    
                                    ${isMyWg ? `
                                        <span class="text-[8.5px] px-1 rounded font-extrabold uppercase scale-90 origin-left border ${isDark ? 'bg-blue-500/15 text-blue-400 border-blue-500/20' : 'bg-blue-100 text-blue-700 border-blue-200'}">Mon WG</span>
                                    ` : isSameCmt ? `
                                        <span class="text-[8.5px] px-1 rounded font-extrabold uppercase scale-90 origin-left border ${isDark ? 'bg-blue-500/15 text-blue-400 border-blue-500/20' : 'bg-blue-100 text-blue-700 border-blue-200'}" title="Même CTM">Même CTM</span>
                                    ` : `
                                        <span class="text-[8.5px] px-1 rounded font-bold uppercase scale-90 origin-left border ${isDark ? 'bg-white/5 text-slate-500 border-white/5' : 'bg-slate-100 text-slate-500 border-slate-200'}" title="Hors CTM">Hors CTM</span>
                                    `}
                                </div>
                                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full uppercase tracking-tight ${isDark ? 'bg-white/5 text-slate-500' : 'bg-slate-100 text-slate-600'}">${wg.tag || 'Actif'}</span>
                            </div>
                            <p class="text-xs font-semibold mt-1.5 line-clamp-1 ${isSelected ? (isDark ? 'text-white' : 'text-slate-900') : (isDark ? 'text-slate-200' : 'text-slate-700')}">${wg.title}</p>
                            
                            ${parallelNorms.length > 0 ? `
                            <div class="mt-2 flex flex-wrap gap-1">
                                ${parallelNorms.map(norm => `
                                <span title="${norm}" class="text-[8.5px] px-1 rounded font-mono font-bold tracking-tight border ${isSelected ? (isDark ? 'bg-blue-500/20 text-blue-300 border-blue-500/30' : 'bg-blue-100 text-blue-700 border-blue-200') : (isDark ? 'bg-white/5 text-slate-400 border-white/5' : 'bg-slate-100 text-slate-500 border-slate-200')}">
                                    ${norm.split(" ")[0]}
                                </span>
                                `).join('')}
                            </div>
                            ` : ''}
                        </button>`;
                    }).join('')}
                </div>
            `;
        }
        else {
            topHtml = `<div class="flex justify-center py-4"><i data-lucide="loader-2" class="w-4 h-4 text-blue-500 animate-spin"></i></div>`;
        }

        // ==========================================
        // 2. RENDU DE LA SECTION BASSE (BOTTOM)
        // ==========================================
        
        let bottomTitle = "Collaborateurs";
        let bottomSubtitle = "Membres du Groupe de Travail (WG) affectés :";
        
        if (sidebarState.activeTab === 'experts') { 
            bottomTitle = "Experts du même CTM";
            bottomSubtitle = "Experts affectés au comité de l'utilisateur connecté :";
        }

        bottomHtml = `
            <div class="mb-3 px-2 flex items-center justify-between pt-4 border-t ${isDark ? 'border-white/5' : 'border-slate-200'}">
                <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5 flex-1 min-w-0 pr-2">
                    <i data-lucide="users" class="h-3.5 w-3.5 text-slate-400 shrink-0"></i>
                    <span class="truncate">${bottomTitle}</span>
                </h2>

                ${sidebarState.activeTab === 'experts' && sidebarState.userRole === "ADMIN" ? `
                    <button onclick="sidebarSelect('pending', null)" class="text-[9.5px] font-bold px-2 py-0.5 rounded transition-all flex items-center gap-1 cursor-pointer shadow-xs border whitespace-nowrap ${
                        sidebarState.expertSelectionType === "pending"
                            ? (isDark ? "bg-amber-500/20 text-amber-400 border-amber-500/30" : "bg-amber-100 text-amber-700 border-amber-300")
                            : (isDark ? "bg-white/5 text-slate-400 border-white/10 hover:bg-white/10" : "bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200")
                    }" title="Demandes d'adhésion">
                        <i data-lucide="alert-triangle" class="h-2.5 w-2.5 shrink-0"></i>
                        En attente (${sidebarState.experts.filter(e => !e.isApproved).length})
                    </button>
                ` : ''}
            </div>
            <p class="text-[11px] mt-0.5 leading-relaxed px-2 mb-2 ${isDark ? 'text-slate-400' : 'text-slate-600'}">${bottomSubtitle}</p>
            
            <div class="space-y-2">
        `;

        if (sidebarState.activeTab === 'experts') {
            const query = (sidebarState.searchQuery || "").toLowerCase();
            const filteredExps = sidebarState.experts.filter(exp => 
                (exp.name && exp.name.toLowerCase().includes(query)) ||
                (exp.structure && exp.structure.toLowerCase().includes(query)) ||
                (exp.role && exp.role.toLowerCase().includes(query))
            );

            if (filteredExps.length === 0) {
                bottomHtml += `<p class="text-[11px] italic p-3 text-center border border-dashed rounded-lg ${isDark ? 'text-slate-500 border-white/5' : 'text-slate-500 border-slate-300'}">Aucun expert trouvé.</p>`;
            } else {
                bottomHtml += filteredExps.map(exp => {
                    const isSelected = sidebarState.expertSelectionType === "expert" && sidebarState.selectedExpertId === exp.id;
                    const btnClass = isSelected
                        ? (isDark ? "bg-blue-500/15 border-blue-500/30 text-blue-400 shadow-xs" : "bg-blue-50 border-blue-300 text-blue-800 shadow-sm")
                        : (isDark ? "bg-black/10 border-white/5 hover:border-white/10 text-slate-300" : "bg-white border-transparent hover:bg-slate-50 text-slate-700");

                    return `
                    <button type="button" onclick="sidebarSelect('expert', '${exp.id}')" class="w-full text-left p-2.5 rounded-lg border flex items-center gap-3 transition-all duration-200 group relative cursor-pointer ${btnClass}">
                        <div class="h-8 w-8 rounded-full flex items-center justify-center text-white text-[10px] font-bold shrink-0 shadow-xs relative ring-1 ${isDark ? 'ring-white/10 bg-slate-700/80' : 'ring-slate-200 bg-slate-600'}">
                            ${exp.name.split(" ").map(n => n[0]).join("")}
                            ${exp.isApproved ? `<span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 bg-blue-500 border-2 ${isDark ? 'border-slate-950' : 'border-white'} rounded-full shadow-[0_0_8px_rgba(16,185,129,0.7)]"></span>` : ''}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-1">
                                <p class="text-xs font-semibold truncate ${isSelected ? (isDark ? 'text-blue-400' : 'text-blue-800') : (isDark ? 'text-slate-200' : 'text-slate-800')}">${exp.name}</p>
                                ${isSelected ? `<span class="text-[8px] font-bold px-1 py-0.5 rounded shrink-0 uppercase tracking-tighter border ${isDark ? 'text-blue-400 bg-blue-500/10 border-blue-400/30' : 'text-blue-700 bg-blue-100 border-blue-300'}">SÉLEC</span>` : ''}
                            </div>
                            <p class="text-[10px] truncate mt-0.5 ${isDark ? 'text-slate-500' : 'text-slate-500'}">${exp.role} (${(exp.structure || "").split(" ")[0]})</p>
                        </div>
                    </button>`;
                }).join('');
            }
        } 
        else {
            // Vue éditeur par défaut
            bottomHtml += sidebarState.collaborators.map(c => `
                <button class="w-full text-left p-2.5 rounded-lg border border-transparent flex items-center gap-3 transition-all ${isDark ? 'hover:bg-white/10 bg-black/10' : 'hover:bg-slate-100 bg-black/5'}">
                    <div class="h-8 w-8 rounded-full flex items-center justify-center text-white text-[10px] font-bold shrink-0 relative" style="background-color: ${c.avatarColor}">
                        ${c.name.substring(0,2).toUpperCase()}
                        ${c.isActive ? `<span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 bg-blue-500 border-2 ${isDark ? 'border-slate-950' : 'border-white'} rounded-full"></span>` : ''}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-semibold truncate ${isDark ? 'text-slate-200' : 'text-slate-700'}">${c.name}</p>
                        <p class="text-[10px] text-slate-500 truncate mt-0.5">${c.role}</p>
                    </div>
                </button>
            `).join('');
        }

        bottomHtml += `</div>`;

        // ==========================================
        // 3. RENDU DU FOOTER (KPIs)
        // ==========================================
        const roleMap = {
            "ADMIN": "Administrateur", "RAP_CTM": "Rapporteur CTM", "SEC_PERM": "Secrétaire SG",
            "PRES_CTM": "Président CTM", "GEST_COMP": "Comptable", "COORD_CTC": "Coordonnateur CTC"
        };
        const displayRole = roleMap[sidebarState.userRole] || "Membre Expert";

        const footerHtml = `
            <div class="flex items-center justify-between uppercase">
                <span class="font-mono text-[9px] text-slate-500">ISO Compliance Mode</span>
                <span class="flex items-center gap-1 text-[9px] ${isDark ? 'text-slate-400' : 'text-slate-600'}">
                    <span class="w-1.5 h-1.5 rounded-full animate-pulse ${isDark ? 'bg-amber-400 shadow-[0_0_8px_rgba(245,158,11,0.8)]' : 'bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.8)]'}"></span> Sync
                </span>
            </div>
            <div class="flex items-center justify-between pt-1.5 border-t ${isDark ? 'border-white/5' : 'border-slate-200'}">
                <span class="text-[9px] uppercase ${isDark ? 'text-slate-400' : 'text-slate-500'}">Poste Actif :</span>
                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase border ${isDark ? 'text-amber-400 bg-amber-400/10 border-amber-400/25' : 'text-blue-600 bg-blue-50 border-blue-200'}">
                    ${displayRole}
                </span>
            </div>
            <div class="pt-1.5">
                <button type="button" onclick="alert('Configuration de profil en cours de développement...')" class="w-full flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-lg border text-[9.5px] font-bold uppercase tracking-wider transition-all cursor-pointer shadow-sm focus:outline-hidden ${isDark ? 'border-amber-500/20 bg-amber-500/5 hover:bg-amber-500/15 text-amber-400 hover:border-amber-400' : 'border-blue-200 bg-blue-50 hover:bg-blue-100 text-blue-600 hover:border-blue-400'}">
                    <span>👤 Configurer Profil Test</span>
                    <span class="${isDark ? 'text-amber-300' : 'text-blue-500'}">&rarr;</span>
                </button>
            </div>
        `;

        topSection.innerHTML = topHtml;
        bottomSection.innerHTML = bottomHtml;
        const footerSection = document.getElementById('sidebar-footer-stats');
        if(footerSection) footerSection.innerHTML = footerHtml;

        lucide.createIcons();
    }

    // --- ACTIONS INTERACTIVES ---
    function updateSearch(val) {
        sidebarState.searchQuery = val;
        renderSidebarContent();
    }

    function sidebarSelect(type, id) {
        if (type === 'doc') sidebarState.selectedDocId = id;
        if (type === 'wg') { sidebarState.selectedWgId = id; sidebarState.expertSelectionType = 'wg'; }
        if (type === 'expert') { sidebarState.selectedExpertId = id; sidebarState.expertSelectionType = 'expert'; }
        if (type === 'pending') { sidebarState.expertSelectionType = 'pending'; }
        
        renderSidebarContent();
        
        window.dispatchEvent(new CustomEvent('sidebar:select', { detail: { type, id, state: sidebarState } }));

        if(typeof window.switchExpertViewMode === 'function') {
            window.switchExpertViewMode(sidebarState.expertSelectionType, id);
        }
    }

    async function hydrateSidebarFromApi() {
        try {
            const headers = { 'X-Requested-With': 'XMLHttpRequest' };
            const [wgsResponse, expertsResponse, ctmsResponse, profileResponse, normsResponse] = await Promise.all([
                fetch('/api/v1/wg/?page_size=100', { headers }),
                fetch('/api/v1/experts/', { headers }),
                fetch('/api/v1/ctm/', { headers }),
                fetch('/api/v1/experts/me/', { headers }),
                fetch('/api/v1/norms/?page_size=100', { headers }),
            ]);

            if (profileResponse.ok) {
                const profile = await profileResponse.json();
                const primaryAff = profile.affectations?.find(aff => aff.is_primary_ctm || aff.is_primary_wg) || profile.affectations?.[0] || null;
                sidebarState.currentCtmId = primaryAff?.ctm || null;
                sidebarState.currentCtmName = primaryAff?.ctm_name || "";
                sidebarState.currentWgId = primaryAff?.wg || null;
            }

            if (ctmsResponse.ok) {
                const data = await ctmsResponse.json();
                sidebarState.ctms = (data.results || data).map(c => ({
                    id: c.id,
                    number: c.number,
                    name: c.name,
                }));
            }

            if (wgsResponse.ok) {
                const data = await wgsResponse.json();
                const mappedWgs = (data.results || data).map(wg => ({
                    id: wg.id,
                    code: wg.ctm && wg.ctm.number ? `WG ${wg.ctm.number}.${wg.number}` : (wg.number || `WG ${wg.id}`),
                    title: wg.name || wg.title || '',
                    tag: wg.status || 'Actif',
                    ctm: wg.ctm?.id || wg.ctm,
                }));
                sidebarState.workingGroups = sidebarState.currentCtmId
                    ? mappedWgs.filter(wg => String(wg.ctm) === String(sidebarState.currentCtmId))
                    : mappedWgs;
                if (!sidebarState.selectedWgId && sidebarState.workingGroups.length) {
                    sidebarState.selectedWgId = sidebarState.workingGroups[0].id;
                }
            }

            if (expertsResponse.ok) {
                const data = await expertsResponse.json();
                const mappedExperts = (data.results || data).map(expert => {
                    const aff = sidebarState.currentCtmId
                        ? expert.affectations?.find(item => String(item.ctm) === String(sidebarState.currentCtmId))
                        : expert.affectations?.[0] || null;
                    const name = expert.user_name || `${expert.user?.first_name || ''} ${expert.user?.last_name || ''}`.trim() || 'Expert';
                    return {
                        id: expert.id,
                        name,
                        role: aff?.role || 'Expert',
                        structure: expert.structure_name || expert.structure?.name || '',
                        email: expert.user?.email || '',
                        ctm: aff?.ctm_name || '',
                        wg: aff?.wg_name || '',
                        isApproved: expert.status === 'ACTIVE',
                    };
                });
                sidebarState.experts = sidebarState.currentCtmId
                    ? mappedExperts.filter(expert => String(expert.ctm) === String(sidebarState.currentCtmId))
                    : mappedExperts;
                sidebarState.collaborators = sidebarState.experts;
                if (!sidebarState.selectedExpertId && sidebarState.experts.length) {
                    sidebarState.selectedExpertId = sidebarState.experts[0].id;
                }
            }

            if (normsResponse.ok) {
                const data = await normsResponse.json();
                const mappedDocs = (data.results || data).map(norm => ({
                    id: norm.id,
                    code: norm.reference_number,
                    title: norm.title,
                    category: NORM_TYPE_LABELS[norm.norm_type] || 'Norme',
                    updatedBy: norm.wg_name || norm.ctm_name || '',
                    ctm: norm.ctm,
                    wg: norm.wg,
                }));
                const scopedDocs = sidebarState.currentCtmId
                    ? mappedDocs.filter(doc => String(doc.ctm) === String(sidebarState.currentCtmId))
                    : mappedDocs;
                sidebarState.documents = scopedDocs.length ? scopedDocs : mappedDocs;
                if (!sidebarState.documents.find(doc => String(doc.id) === String(sidebarState.selectedDocId))) {
                    sidebarState.selectedDocId = sidebarState.documents[0]?.id ?? null;
                }
            }

            renderSidebarContent();
        } catch (error) {
            console.error('Erreur hydratation sidebar:', error);
            renderSidebarContent();
        }
    }

    // Premier rendu au chargement
    document.addEventListener('DOMContentLoaded', () => {
        renderSidebarContent();
        hydrateSidebarFromApi();
    });
</script>
