        </div>

        <div id="sidebar-bottom-section"></div>

    <div class="p-3.5 border-t text-[10px] font-semibold flex flex-col gap-2.5 tracking-wide transition-colors border-slate-200 bg-slate-100 text-slate-600 dark:border-white/5 dark:bg-black/95 dark:text-slate-500">
        <div class="flex items-center justify-between uppercase">
            <span class="font-mono text-[9px] text-slate-500">ISO Compliance Mode</span>
            <span class="flex items-center gap-1 text-[9px] text-slate-600 dark:text-slate-400">

                Sync

<script>
    // --- ÉTAT GLOBAL DE LA SIDEBAR ---
    const sidebarState = {
        activeTab: 'editor',
        searchQuery: '',
        selectedDocId: null,
        selectedWgId: null,
        selectedExpertId: null,
        expertSelectionType: 'expert', // 'wg' ou 'expert'
        historyAuthorFilter: null,
        userRole: 'ADMIN',
        
        // Données vides, à remplir par l'API
        documents: [],
        workingGroups: [],
        experts: [],
        collaborators: [],
        historyEditors: [],
        meetings: [],
        budgets: [],
        validationSteps: []
    };

    // --- FONCTION PRINCIPALE DE RENDU ---
    function renderSidebarContent(tab = null) {
        if (tab) sidebarState.activeTab = tab;
        const topSection = document.getElementById('sidebar-top-section');
        const bottomSection = document.getElementById('sidebar-bottom-section');
        
        let topHtml = '';
        let bottomHtml = '';

        // 1. RENDU DE LA SECTION HAUTE SELON L'ONGLET
        if (sidebarState.activeTab === 'editor') {
            topHtml = `
                <div class="flex items-center justify-between mb-3 px-2">
                    <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                        <i data-lucide="file-text" class="h-3.5 w-3.5 text-slate-400"></i> Documents / Normes
                    </h2>
                    <button onclick="handleAddAction('doc')" class="text-[10px] font-bold px-2 py-1 rounded transition-all flex items-center gap-1 cursor-pointer shadow-xs border text-blue-600 hover:bg-blue-100 bg-blue-50 border-blue-200 dark:text-blue-400 dark:hover:text-white dark:bg-blue-500/10 dark:hover:bg-blue-500/20 dark:border-blue-500/20">
                        <i data-lucide="plus" class="h-3 w-3"></i> Nouveau
                    </button>
                </div>
                <div class="space-y-1">
                    ${sidebarState.documents.map(doc => {
                        const isSelected = doc.id === sidebarState.selectedDocId;
                        const bgClass = isSelected ? "bg-blue-50 border-blue-200 text-blue-800 dark:bg-blue-600/15 dark:border-blue-500/30 dark:text-blue-300 shadow-xs font-bold" : "bg-transparent border-transparent hover:bg-slate-100 text-slate-600 dark:hover:bg-white/5 dark:text-slate-400";
                        const catColor = doc.category === 'Qualité' ? "text-blue-600 bg-blue-100 dark:bg-blue-500/10 dark:text-blue-400" : "text-amber-600 bg-amber-100 dark:bg-amber-500/10 dark:text-amber-400";
                        
                        return `
                        <button onclick="sidebarSelect('doc', '${doc.id}')" class="w-full text-left p-3.5 rounded-lg border transition-all duration-200 flex flex-col gap-1.5 leading-tight ${bgClass}">
                            <div class="flex items-start justify-between gap-2 w-full">
                                <span class="font-semibold text-xs truncate max-w-[150px] ${isSelected ? 'text-slate-900 dark:text-white' : ''}">${doc.title}</span>
                                <span class="text-[9.5px] px-1.5 py-0.5 rounded-full font-bold shrink-0 ${catColor}">${doc.category}</span>
                            </div>
                            <div class="flex items-center justify-between text-[10px] text-slate-500">
                                <span class="font-mono bg-slate-100 border-slate-200 dark:bg-white/5 dark:border-white/5 px-1.5 rounded font-semibold">${doc.code}</span>
                                <span class="truncate max-w-[100px]">Par ${doc.updatedBy}</span>
                            </div>
                            <div class="mt-2 pt-2 border-t border-dashed border-slate-200 dark:border-white/5 flex items-center justify-between">
                                <span class="text-[10px] font-bold flex items-center gap-1 text-slate-600 dark:text-slate-400">
                                    <span class="inline-block w-1.5 h-1.5 rounded-full animate-pulse bg-blue-500"></span> Avis officiel
                                </span>
                                <span class="text-[9px] font-black px-1.5 py-0.5 rounded border flex items-center gap-1 uppercase ${isSelected ? 'bg-blue-600 border-blue-500 text-white dark:bg-blue-500' : 'bg-blue-50 text-blue-700 border-blue-200 dark:bg-blue-500/10 dark:text-blue-500 dark:border-blue-500/20'}">
                                    🗳️ Voter
                                </span>
                            </div>
                        </button>`;
                    }).join('')}
                </div>
            `;
        } 
        else if (sidebarState.activeTab === 'history') {
            topHtml = `
                <div class="px-2 mb-4 relative">
                    <i data-lucide="search" class="absolute left-4 top-2.5 h-3.5 w-3.5 text-slate-500"></i>
                    <input type="text" placeholder="Rechercher une norme..." oninput="updateSearch(this.value)" value="${sidebarState.searchQuery}" class="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-300 bg-white text-xs text-slate-800 focus:outline-none dark:border-white/10 dark:bg-black/55 dark:text-white placeholder-slate-400 font-semibold" />
                </div>
                <div class="flex items-center justify-between mb-3 px-2">
                    <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                        <i data-lucide="file-text" class="h-3.5 w-3.5 text-slate-400"></i> Documents / Normes
                    </h2>
                </div>
                <div class="space-y-1">
                    ${sidebarState.documents.filter(d => d.title.toLowerCase().includes(sidebarState.searchQuery.toLowerCase())).map(doc => {
                        const isSelected = doc.id === sidebarState.selectedDocId;
                        const bgClass = isSelected ? "bg-blue-50 border-blue-200 text-blue-800 dark:bg-blue-600/15 dark:border-blue-500/30 dark:text-blue-300" : "bg-transparent border-transparent hover:bg-slate-100 text-slate-600 dark:hover:bg-white/5 dark:text-slate-400";
                        return `
                        <button onclick="sidebarSelect('doc', '${doc.id}')" class="w-full text-left p-3.5 rounded-lg border transition-all duration-200 flex flex-col gap-1.5 leading-tight ${bgClass}">
                            <div class="flex items-start justify-between gap-2 w-full">
                                <span class="font-semibold text-xs truncate max-w-[150px] ${isSelected ? 'text-slate-900 dark:text-white' : ''}">${doc.title}</span>
                            </div>
                            <div class="flex items-center justify-between text-[10px] text-slate-500">
                                <span class="font-mono px-1.5 rounded font-semibold">${doc.code}</span>
                            </div>
                        </button>`;
                    }).join('')}
                </div>
            `;
        }
        else if (sidebarState.activeTab === 'experts') {
            topHtml = `
                <div class="px-2 mb-4 relative">
                    <i data-lucide="search" class="absolute left-4 top-2.5 h-3.5 w-3.5 text-slate-500"></i>
                    <input type="text" placeholder="Rechercher groupe ou expert..." oninput="updateSearch(this.value)" value="${sidebarState.searchQuery}" class="w-full pl-9 pr-4 py-2 rounded-lg border border-slate-300 bg-white text-xs text-slate-800 focus:outline-none dark:border-white/10 dark:bg-black/55 dark:text-white placeholder-slate-400 font-semibold" />
                </div>
                <div class="flex items-center justify-between mb-3 px-2">
                    <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                        <i data-lucide="award" class="h-3.5 w-3.5 text-slate-400"></i> Groupes de Travail (WG)
                    </h2>
                </div>
                <div class="space-y-1.5">
                    ${sidebarState.workingGroups.map(wg => {
                        const isSelected = sidebarState.expertSelectionType === 'wg' && wg.id === sidebarState.selectedWgId;
                        const bgClass = isSelected ? "bg-blue-50 border-blue-300 shadow-sm dark:bg-blue-500/10 dark:border-blue-500/35" : "bg-white border-slate-200 dark:bg-white/[0.02] dark:border-white/5";
                        return `
                        <button onclick="sidebarSelect('wg', '${wg.id}')" class="w-full p-3 rounded-lg border transition-all text-left block ${bgClass}">
                            <div class="flex items-center justify-between gap-1.5">
                                <span class="font-mono text-[9.5px] font-bold px-1.5 rounded bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-300">${wg.code}</span>
                                <span class="text-[9px] font-bold text-slate-500 bg-slate-100 dark:bg-white/5 px-1.5 py-0.5 rounded-full uppercase">${wg.tag}</span>
                            </div>
                            <p class="text-xs font-semibold mt-1.5 line-clamp-1 text-slate-800 dark:text-slate-200">${wg.title}</p>
                        </button>`;
                    }).join('')}
                </div>
            `;
        }
        else if (sidebarState.activeTab === 'meetings') {
            topHtml = `
                <div class="flex items-center justify-between mb-3 px-2">
                    <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                        <i data-lucide="calendar" class="h-3.5 w-3.5 text-slate-400"></i> Réunions Planifiées
                    </h2>
                    <button onclick="handleAddAction('meeting')" class="text-[10px] font-bold px-2 py-1 rounded transition-all flex items-center gap-1 shadow-xs border text-blue-600 bg-blue-50 border-blue-200 dark:text-blue-400 dark:bg-blue-500/10 dark:border-blue-500/20">
                        <i data-lucide="plus" class="h-3 w-3"></i> Planifier
                    </button>
                </div>
                <div class="space-y-1.5">
                    ${sidebarState.meetings.map(m => `
                    <div class="p-3 bg-white border border-slate-200 dark:bg-white/[0.02] dark:border-white/5 rounded-lg text-left">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] text-slate-500 dark:text-slate-400 font-mono font-bold">${m.date}</span>
                            <span class="text-[8.5px] px-1 rounded font-bold uppercase ${m.status === 'Terminé' ? 'bg-blue-100 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400' : 'bg-amber-100 text-amber-700 dark:bg-amber-500/10 dark:text-amber-400'}">${m.status}</span>
                        </div>
                        <p class="text-xs font-bold text-slate-800 dark:text-white mt-1.5 line-clamp-1">${m.title}</p>
                    </div>`).join('')}
                </div>
            `;
        }
        else if (sidebarState.activeTab === 'financial') {
            topHtml = `
                <div class="flex items-center justify-between mb-3 px-2">
                    <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                        <i data-lucide="coins" class="h-3.5 w-3.5 text-slate-400"></i> Cotisations & Budgets
                    </h2>
                    <button onclick="handleAddAction('budget')" class="text-[10px] font-bold px-2 py-1 rounded transition-all flex items-center gap-1 shadow-xs border text-blue-600 bg-blue-50 border-blue-200 dark:text-blue-400 dark:bg-blue-500/10 dark:border-blue-500/20">
                        <i data-lucide="plus" class="h-3 w-3"></i> Déclarer
                    </button>
                </div>
                <div class="space-y-1.5">
                    ${sidebarState.budgets.map(b => `
                    <div class="p-3 bg-white border border-slate-200 dark:bg-white/[0.02] dark:border-white/5 rounded-lg text-left">
                        <p class="text-xs font-bold text-slate-800 dark:text-white line-clamp-1">${b.title}</p>
                        <div class="flex items-center justify-between mt-1.5 font-mono text-[9px]">
                            <span class="font-semibold text-blue-600 dark:text-blue-400">${b.amount}</span>
                            <span class="text-slate-500 font-semibold">${b.status}</span>
                        </div>
                    </div>`).join('')}
                </div>
            `;
        }
        else if (sidebarState.activeTab === 'validation') {
            topHtml = `
                <div class="flex items-center mb-3 px-2">
                    <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                        <i data-lucide="check-square" class="h-3.5 w-3.5 text-slate-400"></i> Processus ISO
                    </h2>
                </div>
                <div class="space-y-1.5">
                    ${sidebarState.validationSteps.map(s => `
                    <div class="p-3 bg-white border border-slate-200 dark:bg-white/[0.02] dark:border-white/5 rounded-lg text-left">
                        <p class="text-xs font-bold text-blue-600 dark:text-blue-400">${s.title}</p>
                        <p class="text-[10px] text-slate-500 leading-normal mt-0.5">${s.desc}</p>
                    </div>`).join('')}
                </div>
            `;
        }

        // 2. RENDU DE LA SECTION BASSE (Collaborateurs/Experts)
        let bottomTitle = "Collaborateurs";
        if (sidebarState.activeTab === 'history') bottomTitle = "Éditeurs de la Norme";
        if (sidebarState.activeTab === 'experts') bottomTitle = "Experts du CNETP";
        if (sidebarState.activeTab === 'meetings') bottomTitle = "Validations Assemblée";
        if (sidebarState.activeTab === 'financial') bottomTitle = "Trésoriers & Signataires";

        bottomHtml = `
            <div class="mb-3 px-2 flex items-center justify-between pt-4 border-t border-slate-200 dark:border-white/5">
                <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                    <i data-lucide="users" class="h-3.5 w-3.5 text-slate-400"></i> ${bottomTitle}
                </h2>
                ${sidebarState.activeTab === 'editor' ? `
                <button onclick="handleAddAction('expert')" class="text-[10px] font-bold px-2 py-0.5 rounded transition-all flex items-center gap-1 border text-blue-600 bg-blue-50 border-blue-200 dark:text-blue-400 dark:bg-blue-500/10 dark:border-blue-500/20">
                    <i data-lucide="plus" class="h-3 w-3"></i> Inviter
                </button>` : ''}
            </div>
            
            <div class="space-y-2">
                ${sidebarState.activeTab === 'experts' 
                    ? sidebarState.experts.filter(e => e.name.toLowerCase().includes(sidebarState.searchQuery.toLowerCase())).map(e => {
                        const isSelected = sidebarState.expertSelectionType === 'expert' && sidebarState.selectedExpertId === e.id;
                        const bgClass = isSelected ? "bg-blue-50 border-blue-200 dark:bg-blue-500/15 dark:border-blue-500/30" : "bg-transparent border-transparent hover:bg-slate-100 dark:bg-black/10 dark:border-white/5";
                        return `
                        <button onclick="sidebarSelect('expert', '${e.id}')" class="w-full text-left p-2.5 rounded-lg border flex items-center gap-3 transition-all ${bgClass}">
                            <div class="h-8 w-8 rounded-full flex items-center justify-center text-white text-[10px] font-bold shrink-0 bg-slate-700">
                                ${e.name.substring(0,2).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-semibold truncate ${isSelected ? 'text-blue-600 dark:text-blue-400' : 'text-slate-700 dark:text-slate-200'}">${e.name}</p>
                                <p class="text-[10px] text-slate-500 truncate mt-0.5">${e.role}</p>
                            </div>
                        </button>`;
                    }).join('')
                    : sidebarState.activeTab === 'history'
                    ? sidebarState.historyEditors.map(e => `
                        <button onclick="sidebarSelect('historyAuthor', '${e.email}')" class="w-full text-left p-2.5 rounded-lg border flex items-center gap-3 transition-all bg-transparent border-transparent hover:bg-slate-100 dark:bg-black/10 dark:border-white/5">
                            <div class="h-8 w-8 rounded-full flex items-center justify-center text-white text-[10px] font-bold shrink-0" style="background-color: ${e.avatarColor}">
                                ${e.name.substring(0,2).toUpperCase()}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-center">
                                    <p class="text-xs font-semibold truncate text-slate-700 dark:text-slate-200">${e.name}</p>
                                    <span class="text-[8.5px] font-bold px-1.5 rounded bg-slate-200 dark:bg-white/5">${e.count} edits</span>
                                </div>
                                <p class="text-[10px] text-slate-500 truncate mt-0.5">${e.role}</p>
                            </div>
                        </button>`).join('')
                    : sidebarState.collaborators.map(c => `
                        <button class="w-full text-left p-2.5 rounded-lg border flex items-center gap-3 transition-all bg-transparent border-transparent hover:bg-slate-100 dark:bg-black/10 dark:border-white/5">
                            <div class="h-8 w-8 rounded-full flex items-center justify-center text-white text-[10px] font-bold shrink-0 relative" style="background-color: ${c.avatarColor}">
                                ${c.name.substring(0,2).toUpperCase()}
                                ${c.isActive ? '<span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 bg-blue-500 border-2 border-white dark:border-slate-950 rounded-full"></span>' : ''}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-semibold truncate text-slate-700 dark:text-slate-200">${c.name}</p>
                                <p class="text-[10px] text-slate-500 truncate mt-0.5">${c.role}</p>
                            </div>
                        </button>`).join('')
                }
            </div>
        `;

        topSection.innerHTML = topHtml;
        bottomSection.innerHTML = bottomHtml;
        lucide.createIcons();
    }

    // --- ACTIONS INTERACTIVES ---
    function updateSearch(val) {
        sidebarState.searchQuery = val;
        renderSidebarContent();
    }

    function sidebarSelect(type, id) {
        if (type === 'doc') sidebarState.selectedDocId = id;
        if (type === 'wg') { sidebarState.selectedWgId = id; sidebarState.expertSelectionType = 'wg'; }
        if (type === 'expert') { sidebarState.selectedExpertId = id; sidebarState.expertSelectionType = 'expert'; }
        if (type === 'historyAuthor') sidebarState.historyAuthorFilter = id;
        
        renderSidebarContent();
        if(window.showAppToast) window.showAppToast("Sélection mise à jour.");
    }

    function handleAddAction(type) {
        let val;
        if(type === 'doc') {
            if(window.showAppToast) window.showAppToast("Ouverture de l'assistant de création...", "info");
        }
        if(type === 'meeting') {
            val = prompt("Sujet de la nouvelle séance de concertation :");
            if(val) { sidebarState.meetings.push({id:`m-${Date.now()}`, title: val, date: "Planifié", status: "En attente"}); renderSidebarContent(); }
        }
        if(type === 'budget') {
            val = prompt("Nom de la ligne budgétaire :");
            if(val) { sidebarState.budgets.push({id:`b-${Date.now()}`, title: val, amount: "À définir", status: "En attente"}); renderSidebarContent(); }
        }
        if(type === 'expert') {
            val = prompt("Nom de l'expert à inviter :");
            if(val && window.showAppToast) window.showAppToast(`Invitation envoyée à ${val}`);
        }
    }

    // --- ECOUTEURS GLOBAUX ---
    // Cette fonction sera appelée par app.html lorsque l'utilisateur change d'onglet
    window.updateSidebarForTab = function(tabId) {
        sidebarState.searchQuery = ""; // Reset search on tab change
        renderSidebarContent(tabId);
    }

    // Premier rendu au chargement
    document.addEventListener('DOMContentLoaded', () => {
        renderSidebarContent();
    });
</script>
