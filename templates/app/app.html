    <script>

    <style>
        /* ========================================== */
        /* CUSTOM SCROLLBAR (Moderne & Discrète)      */
        /* ========================================== */
        
        /* Largeur globale de la barre */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        /* Fond de la barre (invisible pour l'effet Glassmorphism) */
        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Le "pouce" (la partie qu'on glisse) - Mode Clair par défaut */
        ::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.3); /* Un gris bleuté doux */
            border-radius: 20px;
            /* Astuce pour affiner visuellement le pouce en gardant une zone cliquable large */
            border: 2px solid transparent; 
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(148, 163, 184, 0.5);
        }

        /* Le "pouce" - Adapté pour le Mode Sombre (Dark) */
        html.dark ::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.15); /* Blanc semi-transparent */
        }

        html.dark ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.3); /* Plus visible au survol */
        }
        
        /* Firefox (support standard) */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.3) transparent;
        }
        html.dark * {
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Cacher la barre de défilement tout en gardant le scroll */
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slideIn { animation: slideIn 0.3s ease-out forwards; }
        
        /* Gestion des zones dynamiques */
        .module-container { display: none; }
        .module-container.active { display: flex; animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>

    <script>
        // =========================================================================

        const sidebarState = {

            searchQuery: '',
            selectedDocId: 'doc-1',
            selectedWgId: 'wg-8.1',
            selectedExpertId: 'exp-1',
            expertSelectionType: 'expert',
            
            documents: [
                { id: "doc-1", code: "Pr-RDC 9001", title: "ISO 9001 - Révision RDC", category: "Qualité", updatedBy: "Masamba" },

            ],
            workingGroups: [
                { id: "wg-8.1", code: "WG 8.1", title: "Matériaux Locaux (CTM 8)", tag: "Actif" },
                { id: "wg-1.2", code: "WG 1.2", title: "Stabilité Sols (CTM 1)", tag: "Rédaction" }

            experts: [
                { id: "exp-1", name: "Prof. Masamba Édouard", role: "Président scientifique", structure: "UNIKIN", email: "masamba@cnetp.cd", isApproved: true },

            collaborators: [
                { id: "col-1", name: "Prof. Masamba Édouard", role: "Expert Rédacteur", email: "masamba@cnetp.cd", avatarColor: "#3b82f6", isActive: true },
                { id: "col-2", name: "Marie Laurent", role: "Coordinateur CTC", email: "marie@cnetp.cd", avatarColor: "#ec4899", isActive: false }
            ],
            historyEditors: [
                { email: "masamba@cnetp.cd", name: "Prof. Masamba Édouard", role: "Expert Rédacteur", avatarColor: "#3b82f6", count: 12 },
                { email: "chantal@cnetp.cd", name: "Ir. Chantal Mwamba", role: "Secrétaire", avatarColor: "#14b8a6", count: 3 }
            ],
            meetings: [
                { id: "m-1", title: "Session CTM 8 - Argiles", date: "20 Mai 2026", status: "Terminé" },

            ],

        // =========================================================================
        // 2. FONCTIONS DE RENDU DE LA SIDEBAR
        // =========================================================================
        function renderSidebarContent(tab = null) {
            if (tab) sidebarState.activeTab = tab;
            const topSection = document.getElementById('sidebar-top-section');
            const bottomSection = document.getElementById('sidebar-bottom-section');
            
            if(!topSection || !bottomSection) return;

            let topHtml = '';
            let bottomHtml = '';

            if (sidebarState.activeTab === 'editor') {
                topHtml = `
                    <div class="flex items-center justify-between mb-3 px-2">
                        <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                            <i data-lucide="file-text" class="h-3.5 w-3.5"></i> Documents
                        </h2>
                        <button onclick="handleAddAction('doc')" class="text-[10px] font-bold px-2 py-1 rounded transition-all flex items-center gap-1 cursor-pointer shadow-xs border text-blue-600 hover:bg-blue-100 bg-blue-50 border-blue-200 dark:text-blue-400 dark:hover:text-white dark:bg-blue-500/10 dark:hover:bg-blue-500/20 dark:border-blue-500/20">
                            <i data-lucide="plus" class="h-3 w-3 inline"></i> Nouveau
                        </button>
                    </div>
                    <div class="space-y-1">
                        ${sidebarState.documents.map(doc => {
                            const isSelected = doc.id === sidebarState.selectedDocId;
                            const bgClass = isSelected ? "bg-blue-50 border-blue-200 text-blue-800 dark:bg-blue-600/15 dark:border-blue-500/30 dark:text-blue-300 shadow-xs font-bold" : "bg-transparent border-transparent hover:bg-slate-100 text-slate-600 dark:hover:bg-white/5 dark:text-slate-400";
                            const catColor = doc.category === 'Qualité' ? "text-blue-600 bg-blue-100 dark:bg-blue-500/10 dark:text-blue-400" : "text-amber-600 bg-amber-100 dark:bg-amber-500/10 dark:text-amber-400";
                            
                            return `
                            <button onclick="sidebarSelect('doc', '${doc.id}')" class="w-full text-left p-3.5 rounded-lg border transition-all duration-200 flex flex-col gap-1.5 leading-tight ${bgClass}">
                                <div class="flex items-start justify-between gap-2 w-full">
                                    <span class="font-semibold text-xs truncate max-w-[150px] ${isSelected ? 'text-slate-900 dark:text-white' : ''}">${doc.title}</span>
                                    <span class="text-[9.5px] px-1.5 py-0.5 rounded-full font-bold shrink-0 ${catColor}">${doc.category}</span>
                                </div>
                                <div class="flex items-center justify-between text-[10px] text-slate-500 mt-1">
                                    <span class="font-mono bg-slate-100 border-slate-200 dark:bg-white/5 dark:border-white/5 px-1.5 rounded font-semibold">${doc.code}</span>
                                    <span class="truncate max-w-[100px]">Par ${doc.updatedBy}</span>
                                </div>
                            </button>`;
                        }).join('')}
                    </div>`;
            } 
            else if (sidebarState.activeTab === 'history') {
                topHtml = `
                    <div class="px-2 mb-3 relative">
                        <i data-lucide="search" class="absolute left-4 top-2.5 h-3.5 w-3.5 text-slate-500"></i>
                        <input type="text" placeholder="Rechercher norme..." oninput="updateSidebarSearch(this.value)" value="${sidebarState.searchQuery}" class="w-full pl-9 py-1.5 rounded-lg border border-slate-300 bg-white text-xs text-slate-800 focus:outline-hidden dark:border-white/10 dark:bg-black/55 dark:text-white placeholder-slate-400">
                    </div>
                    <div class="space-y-1">
                        ${sidebarState.documents.filter(d => d.title.toLowerCase().includes(sidebarState.searchQuery.toLowerCase())).map(doc => `
                            <button onclick="sidebarSelect('doc', '${doc.id}')" class="w-full text-left p-3.5 rounded-lg border border-transparent hover:bg-slate-100 text-slate-600 dark:hover:bg-white/5 dark:text-slate-400 transition-all">
                                <span class="font-semibold text-xs">${doc.title}</span>
                            </button>
                        `).join('')}
                    </div>`;
            } 
            else if (sidebarState.activeTab === 'experts') {
                topHtml = `
                    <div class="px-2 mb-3 relative">
                        <i data-lucide="search" class="absolute left-4 top-2.5 h-3.5 w-3.5 text-slate-500"></i>
                        <input type="text" placeholder="Rechercher WG..." oninput="updateSidebarSearch(this.value)" value="${sidebarState.searchQuery}" class="w-full pl-9 py-1.5 rounded-lg border border-slate-300 bg-white text-xs text-slate-800 focus:outline-hidden dark:border-white/10 dark:bg-black/55 dark:text-white placeholder-slate-400">
                    </div>
                    <div class="space-y-1.5">
                        ${sidebarState.workingGroups.filter(wg => wg.title.toLowerCase().includes(sidebarState.searchQuery.toLowerCase()) || wg.code.toLowerCase().includes(sidebarState.searchQuery.toLowerCase())).map(wg => `
                            <button onclick="sidebarSelect('wg', '${wg.id}')" class="w-full text-left p-3 rounded-lg border bg-white border-slate-200 dark:bg-white/[0.02] dark:border-white/5 hover:bg-slate-50 dark:hover:bg-white/5 transition-all">
                                <div class="flex items-center justify-between gap-1.5">
                                    <span class="font-mono text-[9.5px] bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-300 px-1.5 rounded font-bold">${wg.code}</span>
                                    <span class="text-[9px] font-bold text-slate-500 bg-slate-100 dark:bg-white/5 px-1.5 py-0.5 rounded-full uppercase">${wg.tag}</span>
                                </div>
                                <p class="text-xs font-semibold mt-1.5 text-slate-800 dark:text-slate-200">${wg.title}</p>
                            </button>
                        `).join('')}
                    </div>`;
            } 
            else if (sidebarState.activeTab === 'meetings') {
                topHtml = `
                    <div class="flex items-center justify-between mb-3 px-2">
                        <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5"><i data-lucide="calendar" class="h-3.5 w-3.5"></i> Réunions</h2>
                        <button onclick="handleAddAction('meeting')" class="text-[10px] font-bold px-2 py-1 rounded transition-all flex items-center gap-1 border text-blue-600 bg-blue-50 border-blue-200 hover:bg-blue-100 dark:text-blue-400 dark:bg-blue-500/10 dark:border-blue-500/20 dark:hover:bg-blue-500/20 cursor-pointer"><i data-lucide="plus" class="h-3 w-3 inline"></i> Planifier</button>
                    </div>
                    <div class="space-y-1.5">
                        ${sidebarState.meetings.map(m => `
                            <div class="p-3 bg-white border border-slate-200 dark:bg-white/[0.02] dark:border-white/5 rounded-lg text-left">
                                <div class="flex items-center justify-between">
                                    <span class="text-[10px] text-slate-500 dark:text-slate-400 font-mono font-bold">${m.date}</span>
                                    <span class="text-[8.5px] px-1 rounded font-bold uppercase ${m.status === 'Terminé' ? 'bg-blue-100 text-blue-700 dark:bg-blue-500/10 dark:text-blue-400' : 'bg-amber-100 text-amber-700 dark:bg-amber-500/10 dark:text-amber-400'}">${m.status}</span>
                                </div>
                                <p class="text-xs font-bold text-slate-800 dark:text-white mt-1.5">${m.title}</p>
                            </div>
                        `).join('')}
                    </div>`;
            } 
            else if (sidebarState.activeTab === 'financial') {
                topHtml = `
                    <div class="flex items-center justify-between mb-3 px-2">
                        <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5"><i data-lucide="coins" class="h-3.5 w-3.5"></i> Cotisations</h2>
                        <button onclick="handleAddAction('budget')" class="text-[10px] font-bold px-2 py-1 rounded transition-all flex items-center gap-1 border text-blue-600 bg-blue-50 border-blue-200 hover:bg-blue-100 dark:text-blue-400 dark:bg-blue-500/10 dark:border-blue-500/20 dark:hover:bg-blue-500/20 cursor-pointer"><i data-lucide="plus" class="h-3 w-3 inline"></i> Déclarer</button>
                    </div>
                    <div class="space-y-1.5">
                        ${sidebarState.budgets.map(b => `
                            <div class="p-3 bg-white border border-slate-200 dark:bg-white/[0.02] dark:border-white/5 rounded-lg text-left">
                                <p class="text-xs font-bold text-slate-800 dark:text-white">${b.title}</p>
                                <div class="flex items-center justify-between mt-1.5 font-mono text-[9px]">
                                    <span class="font-semibold text-blue-600 dark:text-blue-400">${b.amount}</span>
                                    <span class="text-slate-500 font-semibold">${b.status}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>`;
            }
            else if (sidebarState.activeTab === 'validation') {
                topHtml = `
                    <div class="flex items-center mb-3 px-2">
                        <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5"><i data-lucide="check-square" class="h-3.5 w-3.5"></i> Processus ISO</h2>
                    </div>
                    <div class="space-y-1.5">
                        ${sidebarState.validationSteps.map(s => `
                        <div class="p-3 bg-white border border-slate-200 dark:bg-white/[0.02] dark:border-white/5 rounded-lg text-left">
                            <p class="text-xs font-bold text-blue-600 dark:text-blue-400">${s.title}</p>
                            <p class="text-[10px] text-slate-500 leading-normal mt-0.5">${s.desc}</p>
                        </div>`).join('')}
                    </div>
                `;
            }

            // RENDU SECTION BASSE
            let bTitle = sidebarState.activeTab === 'experts' ? 'Experts du CNETP' : 'Collaborateurs';
            let listData = sidebarState.activeTab === 'experts' ? sidebarState.experts : sidebarState.collaborators;

            bottomHtml = `
                <div class="mb-3 px-2 flex items-center justify-between pt-4 border-t border-slate-200 dark:border-white/5">
                    <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                        <i data-lucide="users" class="h-3.5 w-3.5"></i> ${bTitle}
                    </h2>
                </div>
                <div class="space-y-2">
                    ${listData.map(c => `
                        <button class="w-full text-left p-2.5 rounded-lg border border-transparent hover:bg-slate-100 dark:hover:bg-white/10 bg-black/5 dark:bg-black/10 flex items-center gap-3 transition-all cursor-pointer">
                            <div class="h-8 w-8 rounded-full flex items-center justify-center text-white text-[10px] font-bold shrink-0 relative" style="background-color: ${c.avatarColor || '#3b82f6'}">
                                ${c.name.substring(0,2).toUpperCase()}
                                ${c.isActive ? '<span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 bg-blue-500 border-2 border-white dark:border-slate-950 rounded-full"></span>' : ''}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-semibold text-slate-700 dark:text-slate-200 truncate">${c.name}</p>
                                <p class="text-[10px] text-slate-500 truncate mt-0.5">${c.role}</p>
                            </div>
                        </button>
                    `).join('')}
                </div>`;

            topSection.innerHTML = topHtml;
            bottomSection.innerHTML = bottomHtml;
            lucide.createIcons();
        }

        function updateSidebarSearch(val) {
            sidebarState.searchQuery = val;
            renderSidebarContent();
        }

        function sidebarSelect(type, id) {
            if (type === 'doc') sidebarState.selectedDocId = id;
            if (type === 'wg') sidebarState.selectedWgId = id;
            renderSidebarContent();
            if (window.showAppToast) window.showAppToast("Sélection mise à jour", "success");
        }

        function handleAddAction(type) {
            if(type === 'doc' && window.showAppToast) window.showAppToast("Ouverture de l'assistant de création...", "info");
            if(type === 'meeting') {
                const val = prompt("Sujet de la nouvelle réunion :");
                if(val) { sidebarState.meetings.push({id:`m-${Date.now()}`, title: val, date: "Planifié", status: "En attente"}); renderSidebarContent(); }
            }
            if(type === 'budget') {
                const val = prompt("Nom de la ligne budgétaire :");
                if(val) { sidebarState.budgets.push({id:`b-${Date.now()}`, title: val, amount: "À définir", status: "En attente"}); renderSidebarContent(); }
            }
        }

        // =========================================================================
        // 3. LOGIQUE DE CHARGEMENT DES MODULES (Onglets via AJAX)
        // =========================================================================
        const loadedModules = new Set();

        async function loadModule(moduleId) {
            // A. Gestion visuelle de l'UI des onglets
            document.querySelectorAll('.module-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-400', 'bg-blue-500/10', 'active');
                btn.classList.add('border-transparent', 'text-slate-400');
            });

            const activeContainer = document.getElementById(`module-${moduleId}`);
            const activeBtn = document.getElementById(`btn-${moduleId}`);
            
            if(activeContainer) activeContainer.classList.add('active');
            if(activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-slate-400');
                activeBtn.classList.add('border-blue-500', 'text-blue-400', 'bg-blue-500/10', 'active');
            }

            // B. Mettre à jour la Sidebar
            sidebarState.activeTab = moduleId;
            sidebarState.searchQuery = ""; // Reset search
            renderSidebarContent();

            // C. Si le module est déjà chargé
            if (loadedModules.has(moduleId)) return;

            // D. Logique FETCH
            try {
                if (activeContainer) {
                    activeContainer.innerHTML = `
                        <div class="flex-1 flex flex-col items-center justify-center text-blue-500 h-full">
                            <i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-4"></i>
                            <p class="text-sm font-semibold text-slate-500 dark:text-slate-400">Chargement de l'espace de travail...</p>
                        </div>
                    `;
                    lucide.createIcons();
                }

                // REMPLACER ICI PAR VOTRE URL API DJANGO
                const response = await fetch(`/api/components/${moduleId}/`);
                if (!response.ok) throw new Error(`Erreur réseau: ${response.status}`);
                
                const html = await response.text();
                
                activeContainer.innerHTML = html;
                lucide.createIcons();
                executeScripts(activeContainer); 
                
                loadedModules.add(moduleId);

            } catch (error) {
                console.error("Erreur AJAX:", error);
                if (activeContainer) {
                    activeContainer.innerHTML = `
                        <div class="flex-1 flex flex-col items-center justify-center text-red-500 h-full">
                            <i data-lucide="alert-triangle" class="w-12 h-12 mb-4"></i>
                            <p class="font-bold">Erreur de connexion au serveur.</p>
                            <button onclick="loadModule('${moduleId}')" class="mt-4 px-4 py-2 border border-red-500/30 rounded-lg hover:bg-red-500/10 text-xs font-bold transition-colors cursor-pointer">
                                Réessayer
                            </button>
                        </div>
                    `;
                    lucide.createIcons();
                }
            }
        }

        function executeScripts(element) {
            const scripts = element.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        // =========================================================================
        // 4. UTILITAIRES GLOBAUX (Thème, Toasts)
        // =========================================================================
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const htmlTag = document.documentElement;
            htmlTag.classList.toggle('dark');
            
            if(htmlTag.classList.contains('dark')) {
                document.body.classList.add('bg-[#020204]', 'text-slate-300');
                document.body.classList.remove('bg-slate-50', 'text-slate-800');
            } else {
                document.body.classList.remove('bg-[#020204]', 'text-slate-300');
                document.body.classList.add('bg-slate-50', 'text-slate-800');
            }
            renderSidebarContent();
        });

        window.showAppToast = function(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMsg.textContent = message;
            
            if(type === 'error') {
                toastIcon.setAttribute('data-lucide', 'alert-triangle');
                toastIcon.classList.replace('text-blue-400', 'text-red-400');
            } else if (type === 'info') {
                toastIcon.setAttribute('data-lucide', 'info');
                toastIcon.classList.replace('text-red-400', 'text-blue-400');
            } else {
                toastIcon.setAttribute('data-lucide', 'check-circle-2');
                toastIcon.classList.replace('text-red-400', 'text-blue-400');
            }
            lucide.createIcons();

            toast.classList.remove('hidden');
            toast.classList.add('animate-slideIn');
            
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('animate-slideIn');
            }, 4000);
        }

        // INIT AU DÉMARRAGE
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            document.getElementById('user-display-name').textContent = "Expert Connecté";
            
            renderSidebarContent();
            loadModule('editor'); // Charge le premier onglet automatiquement
        });
    </script>
</body>
</html>
