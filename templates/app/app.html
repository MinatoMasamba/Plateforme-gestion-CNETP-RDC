<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace de Travail - CNETP</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Restore dark mode preference before page renders
        const theme = localStorage.getItem('theme-preference') || 'dark';
        if (theme === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            100: '#06060c',
                            200: '#020204',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* ========================================== */
        /* THEME SYSTEM + CUSTOM SCROLLBAR             */
        /* ========================================== */
        /* Scrollbar: comfortable size and subtle look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.3);
            border-radius: 20px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(148, 163, 184, 0.5); }
        html.dark ::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.15); }
        html.dark ::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.3); }

        /* Firefox (support standard) */
        * { scrollbar-width: thin; scrollbar-color: rgba(148, 163, 184, 0.3) transparent; }
        html.dark * { scrollbar-color: rgba(255, 255, 255, 0.15) transparent; }

        /* Font */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }

        /* Hide scrollbar helper */
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slideIn { animation: slideIn 0.3s ease-out forwards; }

        /* Gestion des zones dynamiques */
        .module-container { display: none; }
        .module-container.active { display: flex; animation: slideIn 0.3s ease-out forwards; }

        /* =========================
           Color system: Light mode
           ========================= */
        :root {
            /* Light mode palette */
            --surface: #F3F4F6;         /* page background (soft off-white) */
            --surface-2: #FFFFFF;       /* component surface */
            --surface-3: #F8FAFC;       /* subtle panels */
            --text-primary: #0F172A;    /* strong readable text */
            --text-muted: #475569;      /* secondary text */
            --border: #E2E8F0;          /* subtle border */
            --blue-primary: #1E40AF;    /* darker blue for light mode */
            --blue-accent: #1B3B8A;     /* deeper accent */
            --glass: rgba(255,255,255,0.7);
            --shadow: 0 10px 30px rgba(2,6,23,0.06);
        }

        /* Dark mode variables (kept for current dark theme behavior) */
        html.dark {
            --surface: #020204;
            --surface-2: #06060c;
            --surface-3: #0b0b10;
            --text-primary: #e5eef8;
            --text-muted: #94a3b8;
            --border: rgba(255,255,255,0.06);
            --blue-primary: #2563eb;
            --blue-accent: #3b82f6;
            --glass: rgba(2,4,7,0.6);
            --shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* Apply base page colors in light mode */
        html:not(.dark) body {
            background-color: var(--surface);
            color: var(--text-primary);
        }

        /* Replace commonly used Tailwind utilities in light mode with improved palette */
        html:not(.dark) .bg-white,
        html:not(.dark) .bg-white\/95,
        html:not(.dark) .bg-white\/50 { background-color: var(--surface-2) !important; }

        /* Slightly off-white panels */
        html:not(.dark) .bg-slate-50,
        html:not(.dark) .bg-slate-50\/50 { background-color: var(--surface-3) !important; }

        /* Text colors */
        html:not(.dark) .text-slate-800,
        html:not(.dark) .text-slate-900 { color: var(--text-primary) !important; }
        html:not(.dark) .text-slate-500,
        html:not(.dark) .text-slate-400,
        html:not(.dark) .text-slate-300 { color: var(--text-muted) !important; }

        /* Make blue tones darker in light mode for legibility */
        /* Strong primary blues used for actions */
        html:not(.dark) .bg-blue-600,
        html:not(.dark) .bg-blue-500 { background-color: var(--blue-primary) !important; }

        /* Subtle blue backgrounds (lighter tones) kept but slightly darker for contrast */
        html:not(.dark) .bg-blue-100 { background-color: rgba(30,64,175,0.08) !important; }
        html:not(.dark) .bg-blue-50 { background-color: rgba(30,64,175,0.04) !important; }

        /* Make text and borders use the stronger blue */
        html:not(.dark) .text-blue-600,
        html:not(.dark) .text-blue-700,
        html:not(.dark) [class*="text-blue-"] { color: var(--blue-primary) !important; }

        html:not(.dark) .border-blue-200,
        html:not(.dark) .border-blue-100 { border-color: var(--border) !important; }
        html:not(.dark) .border-blue-500,
        html:not(.dark) [class*="border-blue-"] { border-color: var(--blue-primary) !important; }

        /* Catch-all for any utility that contains blue in the class name (text/bg/border) */
        html:not(.dark) [class*="text-blue-"] { color: var(--blue-primary) !important; }
        html:not(.dark) [class*="border-blue-"] { border-color: var(--blue-primary) !important; }
        /* For background classes we are conservative: keep strong blues for -500/-600, lighter tones mapped to translucent tints above */
        html:not(.dark) [class*="bg-blue-"] { /* handled above for specific scales */ }


        /* Inputs and form elements */
        html:not(.dark) input,
        html:not(.dark) textarea,
        html:not(.dark) select,
        html:not(.dark) .input,
        html:not(.dark) .form-input {
            background-color: var(--surface-2) !important;
            color: var(--text-primary) !important;
            border-color: var(--border) !important;
        }
        html:not(.dark) input::placeholder,
        html:not(.dark) textarea::placeholder { color: var(--text-muted) !important; opacity: 1; }

        /* Toast styling */
        html:not(.dark) #toast { background-color: rgba(255,255,255,0.95); color: var(--text-primary); border-color: var(--border); }

        /* Primary buttons */
        html:not(.dark) .btn-primary,
        html:not(.dark) .bg-blue-600,
        html:not(.dark) button.bg-blue-600 { background-color: var(--blue-primary) !important; color: white !important; }
        html:not(.dark) .btn-primary:hover,
        html:not(.dark) button.bg-blue-600:hover { background-color: var(--blue-accent) !important; }

        /* Links and interactive elements */
        html:not(.dark) a,
        html:not(.dark) .link { color: var(--blue-primary); }
        html:not(.dark) .muted { color: var(--text-muted); }

        /* Borders and shadows */
        html:not(.dark) .border { border-color: var(--border) !important; }
        html:not(.dark) .shadow { box-shadow: var(--shadow) !important; }

        /* Small helpers */
        html:not(.dark) .text-muted { color: var(--text-muted) !important; }
        html:not(.dark) .bg-surface { background-color: var(--surface-2) !important; }
        html:not(.dark) .bg-surface-1 { background-color: var(--surface) !important; }

        /* Accessibility: stronger focus outline */
        html:not(.dark) :focus { outline: 2px solid var(--blue-primary); outline-offset: 2px; }

    </style>
</head>

    <script>
        // =========================================================================
        // 1. UTILITAIRES API ET ÉTAT GLOBAL
        // =========================================================================

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function apiFetch(url, options = {}) {
            const defaults = {
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                }
            };
            const response = await fetch(url, {
                ...defaults,
                ...options,
                headers: { ...defaults.headers, ...options.headers }
            });
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`API Error: ${response.status} - ${errorText}`);
            }
            return response.json();
        }

        // Afficher le modal de profil quand on clique sur le bouton profil
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('profile-btn');
            if (!btn) return;

            btn.addEventListener('click', async function() {
                try {
                    // Essayer de récupérer le profil utilisateur depuis l'API si disponible
                    let profileData = null;
                    if (typeof window.apiFetch === 'function') {
                        try {
                            const res = await window.apiFetch('/api/v1/profile/');
                            if (res && (res.data || res)) {
                                const d = res.data || res;
                                profileData = {
                                    name: (d.first_name || '') + (d.last_name ? ' ' + d.last_name : ''),
                                    email: d.email || '',
                                    structure: d.structure_name || d.structure || '',
                                    payoutMethod: d.bank_name || '',
                                    accountDetails: d.bank_account || '',
                                    dailyRate: d.daily_rate || d.dailyRate || '',
                                    monthlyResearchAllowance: d.monthly_research_allowance || d.monthlyResearchAllowance || '',
                                    presenceCount: d.presence_count || d.presenceCount || '',
                                    roleId: d.role_id || d.roleId || '',
                                };

                                // si l'API renvoie un expert lié, définir currentExpertId
                                if (d.expert && (d.expert.id || d.expert)) {
                                    window.currentExpertId = d.expert.id || d.expert;
                                } else if (d.expert_id) {
                                    window.currentExpertId = d.expert_id;
                                }
                            }
                        } catch (err) {
                            // ignore, on ouvrira le modal sans données
                            console.warn('Impossible de charger le profil:', err);
                        }
                    }

                    // Ouvrir le modal fourni dans profil_expert.html
                    if (typeof openProfileModal === 'function') {
                        openProfileModal(profileData);
                    } else {
                        // fallback: simplement enlever la class hidden si présent
                        const modal = document.getElementById('profile-modal');
                        if (modal) modal.classList.remove('hidden');
                    }
                } catch (e) {
                    console.error(e);
                }
            });
        });

        const sidebarState = {
            activeTab: 'editor',
            searchQuery: '',
            selectedDocId: null,
            selectedWgId: null,
            selectedExpertId: null,
            expertSelectionType: 'wg',
            documents: [],
            workingGroups: [],
            ctms: [],
            experts: [],
            collaborators: [],
            currentCtmId: null,
            currentCtmName: "",
            historyEditors: [],
            meetings: [],
            budgets: [],
            validationSteps: []
        };
        window.sidebarState = sidebarState;

        window.showAppToast = function(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            const iconEl = document.getElementById('toast-icon');
            if (!toast || !msgEl || !iconEl) return;

            msgEl.textContent = message;
            if (type === 'error') {
                iconEl.setAttribute('data-lucide', 'alert-circle');
                iconEl.className = 'h-5 w-5 text-red-400';
            } else if (type === 'warning') {
                iconEl.setAttribute('data-lucide', 'alert-triangle');
                iconEl.className = 'h-5 w-5 text-amber-400';
            } else {
                iconEl.setAttribute('data-lucide', 'check-circle-2');
                iconEl.className = 'h-5 w-5 text-blue-400';
            }
            safeCreateIcons();
            toast.classList.remove('hidden');

        // Hydratation de la Sidebar depuis l'API
        async function fetchSidebarData() {
            try {
                const results = await Promise.allSettled([
                    apiFetch('/api/v1/norms/'),
                    apiFetch('/api/v1/wg/'),
                    apiFetch('/api/v1/experts/'),
                    apiFetch('/api/v1/reunions/upcoming/'),
                    apiFetch('/api/v1/ctm/'),
                    apiFetch('/api/v1/experts/me/')
                ]);

                const [norms, wgs, experts, meetings, ctms, myProfile] = results.map(r => r.status === 'fulfilled' ? r.value : null);
                const primaryAff = myProfile?.affectations?.find(aff => aff.is_primary_ctm || aff.is_primary_wg) || myProfile?.affectations?.[0] || null;
                sidebarState.currentCtmId = primaryAff?.ctm || null;
                sidebarState.currentCtmName = primaryAff?.ctm_name || "";

                if (ctms) {
                    sidebarState.ctms = (ctms.results || ctms).map(c => ({
                        id: c.id,
                        name: c.name,
                        number: c.number
                    }));
                }

                if (norms) {
                    sidebarState.documents = (norms.results || norms).map(n => ({
                        id: n.id,
                        code: n.reference_number,
                        title: n.title,
                        category: n.status,
                        updatedBy: n.ctm_name || "Admin"
                    }));
                }

                if (wgs) {
                    const mappedWgs = (wgs.results || wgs).map(w => ({
                        id: w.id,
                        code: w.ctm && w.ctm.number ? `WG ${w.ctm.number}.${w.number}` : (w.number || `WG ${w.id}`),
                        title: w.name,
                        tag: "Actif",
                        ctm: w.ctm?.id || w.ctm,
                        ctmName: w.ctm?.name || w.ctm_name || ""
                    }));
                    sidebarState.workingGroups = sidebarState.currentCtmId
                        ? mappedWgs.filter(wg => String(wg.ctm) === String(sidebarState.currentCtmId))
                        : mappedWgs;
                }

                if (experts) {
                    const mappedExperts = (experts.results || experts).map(e => {
                        const ctmAff = sidebarState.currentCtmId
                            ? e.affectations?.find(aff => String(aff.ctm) === String(sidebarState.currentCtmId))
                            : e.affectations?.[0];
                        return {
                            id: e.id,
                            name: e.user_name || `${e.user?.first_name || ''} ${e.user?.last_name || ''}`.trim() || 'Expert',
                            role: ctmAff?.role || e.affectations?.[0]?.role || "Expert",
                            structure: e.structure_name || e.structure?.name || "",
                            ctm: ctmAff?.ctm || e.affectations?.[0]?.ctm || e.ctm,
                            wg: ctmAff?.wg || e.affectations?.[0]?.wg || null,
                            isApproved: e.status === 'ACTIVE',
                            avatarColor: "#3b82f6"
                        };
                    });
                    sidebarState.experts = sidebarState.currentCtmId
                        ? mappedExperts.filter(expert => String(expert.ctm) === String(sidebarState.currentCtmId))
                        : mappedExperts;
                    sidebarState.collaborators = sidebarState.experts;
                }

                if (!sidebarState.selectedWgId || !sidebarState.workingGroups.some(wg => String(wg.id) === String(sidebarState.selectedWgId))) {
                    sidebarState.selectedWgId = sidebarState.workingGroups[0]?.id || null;
                }
                if (!sidebarState.selectedExpertId || !sidebarState.experts.some(expert => String(expert.id) === String(sidebarState.selectedExpertId))) {
                    sidebarState.selectedExpertId = sidebarState.experts[0]?.id || null;
                }

                if (meetings) {
                    sidebarState.meetings = (meetings.results || meetings).map(m => ({
                        id: m.id,
                        title: m.titre,
                        date: new Date(m.date).toLocaleDateString('fr-FR'),
                        status: m.status
                    }));
                }

                renderSidebarContent();

                if (!sidebarState.selectedDocId && sidebarState.documents.length > 0) {
                    sidebarSelect('doc', sidebarState.documents[0].id);
                }
            } catch (error) {
                console.error("Failed to fetch sidebar data:", error);
                renderSidebarContent(); // Toujours rendre même en cas d'erreur
            }
        }

        async function loadDocumentDetails(id) {
            try {
                const doc = await apiFetch(`/api/v1/norms/${id}/`);

                // Mettre à jour l'état global de l'éditeur (si disponible)
                if (typeof editorState !== 'undefined') {
                    editorState.document = doc;
                    editorState.text = doc.latest_version ? doc.latest_version.content : "";
                    if (typeof loadNormeVotes === 'function') {
                        await loadNormeVotes();
                        if (typeof renderVotes === 'function') renderVotes();
                    }
                }

                // Notification pour le module historique s'il est actif
                if (sidebarState.activeTab === 'history' && typeof initHistoryModule === 'function') {
                    initHistoryModule(id);
                }

                // Mise à jour du DOM (seulement si les éléments existent, ex: quand l'éditeur est affiché)
                const updates = {
                    'ed-doc-title': doc.title,
                    'ed-doc-code': doc.reference_number,
                    'ed-doc-desc': doc.description || "Aucune description.",
                    'ed-doc-ctm': doc.ctm_name || "Non assigné",
                    'ed-main-textarea': doc.latest_version ? doc.latest_version.content : "Document sans contenu."
                };

                for (const [id, val] of Object.entries(updates)) {
                    const el = document.getElementById(id);
                    if (el) {
                        if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') el.value = val;
                        else el.textContent = val;
                    }
                }

                if (document.getElementById('ed-main-textarea')) {
                    document.getElementById('ed-main-textarea').dispatchEvent(new Event('input'));
                }

                const editorContent = document.getElementById('editor-content');
                const editorPlaceholder = document.getElementById('editor-placeholder');
                if (editorContent && editorPlaceholder) {
                    editorContent.classList.remove('hidden');
                    editorPlaceholder.classList.add('hidden');
                }

                if (window.showAppToast) window.showAppToast(`Norme chargée : ${doc.reference_number}`);
            } catch (error) {
                console.error("Error loading document details:", error);
                if (window.showAppToast) window.showAppToast("Erreur lors du chargement des détails.", "error");
            }
        }

        function sidebarSelect(type, id) {
            if (type === 'doc') {
                sidebarState.selectedDocId = id;
                loadDocumentDetails(id);
            }
            if (type === 'wg') {
                sidebarState.selectedWgId = id;
                sidebarState.expertSelectionType = 'wg';
            }
            if (type === 'expert') {
                sidebarState.selectedExpertId = id;
                sidebarState.expertSelectionType = 'expert';
            }
            renderSidebarContent();
            window.dispatchEvent(new CustomEvent('sidebar:select', { detail: { type, id, state: sidebarState } }));
            if (typeof window.switchExpertViewMode === 'function' && (type === 'wg' || type === 'expert')) {
                window.switchExpertViewMode(type, id);
            }
        }

        function openMessagingWidget() {
            chatState.isOpen = true; chatState.isMinimized = false;
            document.getElementById('toggle-messaging-floating').classList.add('hidden');
            const win = document.getElementById('messaging-window');
            win.classList.remove('hidden'); win.classList.add('flex');
            win.classList.replace("w-80", "w-[700px]"); win.classList.replace("h-14", "h-[500px]");
            document.getElementById('messaging-content').classList.remove('hidden');
            document.getElementById('minimize-icon').classList.remove('rotate-180');
            if (!chatState.activeContactId) setActiveContact(chatState.contacts[0].id);
            else { renderContacts(); renderMessages(); }
        }

        function closeMessagingWidget() {
            chatState.isOpen = false;
            document.getElementById('messaging-window').classList.add('hidden');
            document.getElementById('messaging-window').classList.remove('flex');
            document.getElementById('toggle-messaging-floating').classList.remove('hidden');
        }

        function minimizeMessagingWidget() {
            chatState.isMinimized = !chatState.isMinimized;
            const win = document.getElementById('messaging-window');
            if (chatState.isMinimized) {
                win.classList.replace("w-[700px]", "w-80"); win.classList.replace("h-[500px]", "h-14");

                document.getElementById('minimize-icon').classList.add('rotate-180');

        function setActiveContact(id) {
            chatState.activeContactId = id;
            const contact = chatState.contacts.find(c => c.id === id);
            document.getElementById('active-contact-name').textContent = contact.name;
            document.getElementById('active-contact-role').textContent = contact.role;
            document.getElementById('active-contact-struct').textContent = contact.structure || "";

        function renderContacts(query = "") {
            const filtered = chatState.contacts.filter(c => c.name.toLowerCase().includes(query.toLowerCase()));
            document.getElementById('contacts-list').innerHTML = filtered.map(c => {
                const isSelected = c.id === chatState.activeContactId;

        function filterContacts(val) { renderContacts(val); }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            const msgs = chatState.messages[chatState.activeContactId] || [];
            if (msgs.length === 0) {
                container.innerHTML = `<p class="text-[10.5px] text-slate-500 italic py-12 text-center">Début de l'historique sécurisé.</p>`; return;
            }
            container.innerHTML = msgs.map(m => {
                const isMe = m.senderId === "me";
                const wrapperClass = isMe ? "justify-end" : "justify-start";
                const bubbleClass = isMe ? "bg-blue-600 text-white dark:bg-blue-500/10 dark:border dark:border-blue-500/25 dark:text-slate-100" : "bg-slate-100 border border-slate-200 text-slate-800 dark:bg-white/[0.03] dark:border-white/5 dark:text-slate-200";
                return `<div class="flex ${wrapperClass} animate-fadeIn"><div class="max-w-[85%] rounded-xl px-3.5 py-2.5 text-xs shadow-sm ${bubbleClass}"><p class="whitespace-pre-wrap">${m.text}</p><div class="mt-1 flex items-center justify-end gap-1.5 text-[8.5px] ${isMe ? 'text-blue-100 dark:text-white/40' : 'text-slate-400 dark:text-white/40'}"><span>${m.timestamp}</span>${isMe ? `<i data-lucide="check-check" class="h-3 w-3"></i>` : ''}</div></div></div>`;
            }).join('');
            safeCreateIcons(); scrollToBottom();
        }

        function scrollToBottom() {
            const c = document.getElementById('messages-container'); c.scrollTop = c.scrollHeight;
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input-text');
            const text = input.value.trim();
            if (!text) return;

            const timeStr = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
            if(!chatState.messages[chatState.activeContactId]) chatState.messages[chatState.activeContactId] = [];

            chatState.messages[chatState.activeContactId].push({ id: `msg-${Date.now()}`, senderId: "me", senderName: chatState.myProfile.name, text: text, timestamp: timeStr });
            input.value = ""; document.getElementById('send-msg-btn').disabled = true; renderMessages();

            setTimeout(() => {
                chatState.messages[chatState.activeContactId].push({ id: `rep-${Date.now()}`, senderId: chatState.activeContactId, text: "Bien reçu.", timestamp: new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) });
                if (chatState.isOpen) renderMessages();
            }, 1500);
        }

        const loadedModules = new Set();

        async function loadModule(moduleId) {
            document.querySelectorAll('.module-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-400', 'bg-blue-500/10', 'active');
                btn.classList.add('border-transparent', 'text-slate-400');
            });

            const actC = document.getElementById(`module-${moduleId}`);
            const actB = document.getElementById(`btn-${moduleId}`);
            if(actC) actC.classList.add('active');
            if(actB) {
                actB.classList.remove('border-transparent', 'text-slate-400');
                actB.classList.add('border-blue-500', 'text-blue-400', 'bg-blue-500/10', 'active');
            }

            sidebarState.activeTab = moduleId;
            renderSidebarContent();

            if (loadedModules.has(moduleId)) {
                if (moduleId === 'editor' && sidebarState.selectedDocId) {
                    loadDocumentDetails(sidebarState.selectedDocId);
                }
                if (moduleId === 'history' && sidebarState.selectedDocId && typeof initHistoryModule === 'function') {
                    initHistoryModule(sidebarState.selectedDocId);
                }
                return;
            }

            try {
                if (actC) {
                    actC.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center text-blue-500 h-full"><i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-4"></i><p class="text-sm font-semibold text-slate-500 dark:text-slate-400">Chargement...</p></div>`;
                    safeCreateIcons();
                }

                const response = await fetch(`/api/components/${moduleId}/`);
                if (!response.ok) throw new Error("Erreur réseau");

                const html = await response.text();
                actC.innerHTML = html;

                safeCreateIcons();
                executeScripts(actC);
                loadedModules.add(moduleId);

                if (moduleId === 'editor' && sidebarState.selectedDocId) {
                    loadDocumentDetails(sidebarState.selectedDocId);
                }
                if (moduleId === 'history' && sidebarState.selectedDocId && typeof initHistoryModule === 'function') {
                    initHistoryModule(sidebarState.selectedDocId);
                }
            } catch (error) {
                console.error("AJAX Error:", error);
            }
        }

        function safeCreateIcons() {
            try {
                if (typeof lucide !== 'undefined' && lucide.createIcons) {
                    lucide.createIcons();
                }
            } catch (e) {
                console.warn("Lucide icons error:", e);
            }
        }

        function executeScripts(el) {
            const scripts = [];
            if (el.tagName === 'SCRIPT') scripts.push(el);
            scripts.push(...Array.from(el.querySelectorAll('script')));

            scripts.forEach(oldScript => {
                const newS = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => newS.setAttribute(attr.name, attr.value));
                newS.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newS, oldScript);
            });
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme-preference', isDark ? 'dark' : 'light');

            if(isDark) {
                document.body.classList.add('bg-[#020204]', 'text-slate-300');
                document.body.classList.remove('bg-slate-50', 'text-slate-800');
            } else {
                document.body.classList.remove('bg-[#020204]', 'text-slate-300');
                document.body.classList.add('bg-slate-50', 'text-slate-800');
            }
            renderSidebarContent();
        });

        document.addEventListener('DOMContentLoaded', () => {
            safeCreateIcons();
            document.getElementById('user-display-name').textContent = "{{ user|default:'Expert Connecté' }}";
            fetchSidebarData();
            loadModule('editor');

            // Charger le composant de messagerie
            (async () => {
                const messagingContainer = document.getElementById('messaging-widget-container');
                if (!messagingContainer) return;
                try {
                    const res = await fetch('/api/components/messaging/');
                    if (res.ok) {
                        messagingContainer.innerHTML = await res.text();
                        executeScripts(messagingContainer);
                        safeCreateIcons();
                    }
                } catch (err) { console.error('Erreur fetch messaging component:', err); }
            })();



            // Connecter les boutons de profil
            document.getElementById('profile-btn').addEventListener('click', showMyProfile);
        });

    </script>


</body>
</html>
