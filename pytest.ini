[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
testpaths = tests apps
norecursedirs = .git .tox venv mon_env node_modules build_tailwind htmlcov staticfiles media
