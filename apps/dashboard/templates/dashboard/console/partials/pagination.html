{% if pages %}
<nav class="console-pagination" aria-label="Pagination">
    <span class="console-page-meta">{{ pagination_meta }}</span>
    <div class="console-page-links">
        {% if previous_url %}
        <a href="{{ previous_url }}" aria-label="Page précédente">‹</a>
        {% else %}
        <span class="is-disabled" aria-hidden="true">‹</span>
        {% endif %}
        {% for page in pages %}
            {% if page.ellipsis %}
            <span class="is-disabled">…</span>
            {% elif page.current %}
            <span class="is-current" aria-current="page">{{ page.number }}</span>
            {% else %}
            <a href="{{ page.url }}">{{ page.number }}</a>
            {% endif %}
        {% endfor %}
        {% if next_url %}
        <a href="{{ next_url }}" aria-label="Page suivante">›</a>
        {% else %}
        <span class="is-disabled" aria-hidden="true">›</span>
        {% endif %}
    </div>
</nav>
{% endif %}
