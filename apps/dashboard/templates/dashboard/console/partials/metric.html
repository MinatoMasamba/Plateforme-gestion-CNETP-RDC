<article class="console-metric{% if tone %} console-metric--{{ tone }}{% endif %}">
    <div class="console-metric-heading">
        <span class="console-metric-icon"><i data-lucide="{{ icon }}" aria-hidden="true"></i></span>
        <h2>{{ label }}</h2>
    </div>
    <strong>{{ value }}</strong>
    <p>{{ detail }}</p>
</article>
