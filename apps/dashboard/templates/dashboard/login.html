<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — CNETP Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <!-- Header -->
      <div class="px-8 pt-8 pb-6 text-center" style="background:#1a3a6b;">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4" style="background:#c9a227;">
          <i data-lucide="shield-check" class="w-7 h-7 text-white"></i>
        </div>
        <h2 class="text-white text-xl font-bold">CNETP</h2>
        <p class="text-white/60 text-sm mt-1">Tableau de bord — Administration</p>
      </div>

      <!-- Body -->
      <div class="px-8 py-7">
        {% if messages %}
          {% for msg in messages %}
            <div class="mb-4 flex items-center gap-2 px-3 py-2.5 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
              <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
              {{ msg }}
            </div>
          {% endfor %}
        {% endif %}

        <form method="post" class="space-y-4">
          {% csrf_token %}
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Identifiant</label>
            <div class="relative">
              <i data-lucide="user" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input type="text" name="username" autofocus required
                class="w-full pl-9 pr-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder:text-slate-300"
                placeholder="Votre identifiant">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Mot de passe</label>
            <div class="relative">
              <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input type="password" name="password" required
                class="w-full pl-9 pr-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder:text-slate-300"
                placeholder="••••••••">
            </div>
          </div>
          <button type="submit"
            class="w-full py-2.5 rounded-lg text-white text-sm font-semibold flex items-center justify-center gap-2 mt-2 transition hover:opacity-90"
            style="background:#1a3a6b;">
            <i data-lucide="log-in" class="w-4 h-4"></i>
            Se connecter
          </button>
        </form>

        <p class="text-center text-slate-400 text-xs mt-5">Accès réservé au personnel autorisé CNETP</p>
      </div>
    </div>

    <p class="text-center text-white/30 text-xs mt-6">© 2026 CNETP — Tous droits réservés</p>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
